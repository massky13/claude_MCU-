Screens:
  Location_Audit:
    Children:
      - RectHeader_audit:
          Control: Rectangle
          Properties:
            Height: =64
            Width: =Parent.Width
      - lbl_audit_title:
          Control: Label
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Size: =20
            Text: ="LOCATION AUDIT"
            Width: =600
            X: =103
            Y: =14
      - Icon_audit_home:
          Control: Classic/Icon
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Icon: =Icon.Home
            OnSelect: =Navigate(Splash_Screen, ScreenTransition.Fade)
            X: =20
            Y: =12
      - lbl_search_hint:
          Control: Label
          Properties:
            Color: =RGBA(100, 100, 100, 1)
            Size: =11
            Text: ="Search by name or keyword, then click Add. Repeat to accumulate results from multiple searches."
            Width: =800
            X: =20
            Y: =75
      - emp_audit_search:
          Control: Classic/TextInput
          Properties:
            HintText: ="Name or keyword (e.g. plant name, department)"
            Width: =420
            X: =20
            Y: =100
      - btn_audit_add:
          Control: Classic/Button
          Properties:
            OnSelect: |-
              =Collect(col_audit,
                  ForAll(
                      Office365Users.SearchUserV2({searchTerm: emp_audit_search.Text, top: 50}).value,
                      {
                          display_name: ThisRecord.DisplayName,
                          mail: ThisRecord.Mail,
                          office_loc: Office365Users.UserProfileV2(ThisRecord.Mail).officeLocation
                      }
                  )
              )
            Text: ="Add to Audit"
            Width: =130
            X: =450
            Y: =100
      - btn_audit_clear:
          Control: Classic/Button
          Properties:
            OnSelect: =Clear(col_audit); Set(varAuditFilter, "All")
            Text: ="Clear All"
            Width: =100
            X: =590
            Y: =100
      - lbl_total_count:
          Control: Label
          Properties:
            Text: |-
              ="Total: " & CountRows(col_audit)
            Width: =110
            X: =720
            Y: =108
      - lbl_valid_count:
          Control: Label
          Properties:
            Color: =RGBA(0, 150, 0, 1)
            FontWeight: =FontWeight.Bold
            Text: |-
              ="Valid: " & CountIf(col_audit, IsNumeric(office_loc) && Len(Trim(office_loc)) = 3)
            Width: =110
            X: =840
            Y: =108
      - lbl_invalid_count:
          Control: Label
          Properties:
            Color: =RGBA(200, 0, 0, 1)
            FontWeight: =FontWeight.Bold
            Text: |-
              ="Invalid: " & CountIf(col_audit, Not(IsNumeric(office_loc) && Len(Trim(office_loc)) = 3))
            Width: =120
            X: =960
            Y: =108
      - btn_filter_all:
          Control: Classic/Button
          Properties:
            Height: =34
            OnSelect: =Set(varAuditFilter, "All")
            Text: ="All"
            Width: =80
            X: =20
            Y: =153
      - btn_filter_valid:
          Control: Classic/Button
          Properties:
            Height: =34
            OnSelect: =Set(varAuditFilter, "Valid")
            Text: ="Valid"
            Width: =80
            X: =110
            Y: =153
      - btn_filter_invalid:
          Control: Classic/Button
          Properties:
            Height: =34
            OnSelect: =Set(varAuditFilter, "Invalid")
            Text: ="Invalid"
            Width: =90
            X: =200
            Y: =153
      - lbl_col_name:
          Control: Label
          Properties:
            FontWeight: =FontWeight.Bold
            Text: ="Name"
            Width: =280
            X: =20
            Y: =196
      - lbl_col_email:
          Control: Label
          Properties:
            FontWeight: =FontWeight.Bold
            Text: ="Email"
            Width: =380
            X: =310
            Y: =196
      - lbl_col_loc:
          Control: Label
          Properties:
            FontWeight: =FontWeight.Bold
            Text: ="Office Location"
            Width: =200
            X: =700
            Y: =196
      - lbl_col_status:
          Control: Label
          Properties:
            FontWeight: =FontWeight.Bold
            Text: ="Status"
            X: =910
            Y: =196
      - gal_audit:
          Control: Gallery
          Variant: Vertical
          Properties:
            Height: =510
            Items: |-
              =Sort(
                  Filter(col_audit,
                      varAuditFilter = "All" ||
                      (varAuditFilter = "Valid" && IsNumeric(office_loc) && Len(Trim(office_loc)) = 3) ||
                      (varAuditFilter = "Invalid" && Not(IsNumeric(office_loc) && Len(Trim(office_loc)) = 3))
                  ),
                  office_loc,
                  SortOrder.Ascending
              )
            TemplateSize: =50
            Width: =1326
            X: =20
            Y: =218
          Children:
            - lbl_row_name:
                Control: Label
                Properties:
                  Height: =50
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.display_name
                  Width: =280
            - lbl_row_email:
                Control: Label
                Properties:
                  Color: =RGBA(80, 80, 80, 1)
                  Height: =50
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: =ThisItem.mail
                  Width: =380
                  X: =290
            - lbl_row_loc:
                Control: Label
                Properties:
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.office_loc
                  Width: =200
                  X: =680
            - lbl_row_status:
                Control: Label
                Properties:
                  Color: =If(IsNumeric(ThisItem.office_loc) && Len(Trim(ThisItem.office_loc)) = 3, RGBA(0, 150, 0, 1), RGBA(200, 0, 0, 1))
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  OnSelect: =Select(Parent)
                  Text: =If(IsNumeric(ThisItem.office_loc) && Len(Trim(ThisItem.office_loc)) = 3, "OK", "Invalid")
                  X: =890
