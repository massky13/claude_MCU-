                        - lbl_total_lft:
                            Control: Label
                            Properties:
                              FontWeight: =FontWeight.Lighter
                              Height: =30
                              OnSelect: =Select(btn_floor_select)
                              Size: =7
                              Text: |
                                =(
                                    RoundDown((Value(ThisItem.Length) - 0.1) / 4, 0) *
                                    If(
                                        section_drop.SelectedText.Value = "S",
                                        Value(ThisItem.Width) - 6/12,
                                        If(
                                            section_drop.SelectedText.Value = "M",
                                            Value(ThisItem.Width) - 3/12,
                                            Blank()
                                        )
                                    )
                                )
                                +
                                If(
                                    Or(
                                        Upper(Text(ThisItem.foam_oversidewalls)) = "TRUE",
                                        Upper(Text(ThisItem.foam_oversidewalls)) = "YES"
                                    ),
                                    Value(ThisItem.Length) * 2,
                                    If(
                                        section_drop.SelectedText.Value = "S",
                                        0,
                                        If(
                                            section_drop.SelectedText.Value = "M",
                                            Value(ThisItem.Length),
                                            Blank()
                                        )
                                    )
                                )
                                +
                                (
                                    (
                                        If(
                                            Value(truss_drop.SelectedText.Value) = 24,
                                            RoundUp(Value(ThisItem.Length) / 2, 0) + 1,
                                            If(
                                                Value(truss_drop.SelectedText.Value) = 16,
                                                RoundUp(Value(ThisItem.Length) * 3 / 4, 0) + 1,
                                                If(
                                                    Value(truss_drop.SelectedText.Value) = 12,
                                                    RoundUp(Value(ThisItem.Length), 0) + 1,
                                                    0
                                                )
                                            )
                                        )
                                        -
                                        If(
                                            Value(ThisItem.foam_trussendwall) = 1,
                                            0,
                                            If(
                                                Value(ThisItem.foam_trussendwall) = 2,
                                                1.5,
                                                2
                                            )
                                        )
                                    ) *
                                    If(
                                        section_drop.SelectedText.Value = "S",
                                        Value(ThisItem.Width) - 6/12,
                                        If(
                                            section_drop.SelectedText.Value = "M",
                                            Value(ThisItem.Width) - 3/12,
                                            Blank()
                                        )
                                    )
                                )
                                +
                                If(extra_lft.Text = "", 0, Value(extra_lft.Text))
