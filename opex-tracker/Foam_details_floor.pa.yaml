Screens:
  Foam_details_floor:
    Properties:
      OnVisible: |-
        =Set(var_selected_date, Today()-Weekday(Today(),3));
        ClearCollect(col_week_picker,
            ForAll(Sequence(8),
                With({ms: DateAdd(Date(Year(Today()), Month(Today()) - 6, 1), ThisRecord.Value - 1, TimeUnit.Months)},
                With({fm: DateAdd(ms, Mod(8 - Weekday(ms, StartOfWeek.Monday), 7), TimeUnit.Days)},
                {
                    month_label: Text(ms, "mmm") & " " & Text(ms, "yy"),
                    w1: fm,
                    w2: If(Month(DateAdd(fm, 7, TimeUnit.Days)) = Month(ms), DateAdd(fm, 7, TimeUnit.Days)),
                    w3: If(Month(DateAdd(fm, 14, TimeUnit.Days)) = Month(ms), DateAdd(fm, 14, TimeUnit.Days)),
                    w4: If(Month(DateAdd(fm, 21, TimeUnit.Days)) = Month(ms), DateAdd(fm, 21, TimeUnit.Days)),
                    w5: If(Month(DateAdd(fm, 28, TimeUnit.Days)) = Month(ms), DateAdd(fm, 28, TimeUnit.Days))
                }))
            )
        );
        ClearCollect(
            colFoamFloorDetails,
            AddColumns(
                SortByColumns(
                    Filter(
                        roofs_alldetails,
                        PlantID = PID,
                        Facility = Coalesce(Dropdown1_8.SelectedText.Value, facilityID),
                        W_Date = var_selected_date
                    ),
                    "Title",
                    SortOrder.Ascending
                ),
                _dirty, false,
                ToDelete, false
            )
        )
