                                Value(cstart_2.Text) <> ThisItem.Cycle2_start || Value(cend_2.Text)<>ThisItem.Cycle2_end ||
                                Value( truss_drop.Selected.Value )<>ThisItem.Truss_spacing
                              DisplayMode: =DisplayMode.View
