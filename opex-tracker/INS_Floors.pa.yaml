                  Default: |-
                    =If (
                        var_insulation_name = "OC Propink 77",
                        If(
                            rvalue_txt_1.Text = "",
                            "",
                            RoundUp(
                                (1 + ThisItem.SQFeet - If(
                                    duct_check.Value = true,
                                    ThisItem.Length * 0.8 * LookUp(
                                        Plant_Settings,
                                        facility_lookup = var_plantfacility,
                                        Duct_width
                                    ) / 12,
                                    0
                                ) - (ThisItem.PLength*ThisItem.PWidth)) / (1000 / (0.0012 * Value(rvalue_txt_1.Text) ^ 2 + 0.3918 * Value(rvalue_txt_1.Text) + 0.1448)),
                                0
                            )
                        ),
                    If (
                        var_insulation_name = "Sanctuary",
                        If(
                            rvalue_txt_1.Text = "",
                            "",
                            RoundUp(
                                (1 + ThisItem.SQFeet - If(
                                    duct_check.Value = true,
                                    ThisItem.Length * 0.8 * LookUp(
                                        Plant_Settings,
                                        facility_lookup = var_plantfacility,
                                        Duct_width
                                    ) / 12,
                                    0
                                ) - (ThisItem.PLength*ThisItem.PWidth)) / (1426.01602 * Value(rvalue_txt_1.Text) ^ -1.187636),
                                0
                            )
                        ),
                        If(
                            rvalue_txt_1.Text = "",
                            "",
                            RoundUp(
                                (1 + ThisItem.SQFeet - If(
                                    duct_check.Value = true,
                                    ThisItem.Length * 0.8 * LookUp(
                                        Plant_Settings,
                                        facility_lookup = var_plantfacility,
                                        Duct_width
                                    ) / 12,
                                    0
                                ) - (ThisItem.PLength*ThisItem.PWidth)) / (1426.01602 * Value(rvalue_txt_1.Text) ^ -1.187636),
                                0
                            )
                        )
                    ))
