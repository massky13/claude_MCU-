      - Button1_1:
          Control: Classic/Button
          Properties:
            BorderThickness: =0
            Fill: =RGBA(2, 66, 109, 1)
            OnSelect: |
              =Clear(Col3Dim);
              ForAll(ForAll(Split(Text1_1.Text,Char(10)), {Result: ThisRecord.Value}),
              Collect(Col3Dim,Table({
              CDate:First(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value})).Result,
              CRun:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),2)).Result,
              CItem:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),3)).Result,
              CModel:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),4)).Result,
              CFloor:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),5)).Result,
              CType:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),6)).Result,
              CSize:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,

              CRLength: If(Dropdown1_2.SelectedText.Value="Length x Width",Text(Left(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x"),Find("x",Text(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x")))-1)),Text(Mid(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x"),Find("x",Text(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x")))+1,9))),

              CRWide: If(Dropdown1_2.SelectedText.Value="Length x Width",Text(Mid(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x"),Find("x",Text(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x")))+1,9)),Text(Left(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x"),Find("x",Text(Substitute(Substitute(Substitute(Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,"""","")," ",""),"X","x")))-1))),

              CRValue:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),8)).Result
              })));
