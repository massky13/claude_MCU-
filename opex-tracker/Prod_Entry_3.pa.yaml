            OnSelect: "=Set(VAR_by_floor,true);\r\n\r\nSet(facilityID,Dropdown1_1.SelectedText.Value);\r\n\r\nForAll(Col3Dim, \r\n    Patch(Production_Master, \r\n        Defaults(Production_Master),\r\n        {\r\n            Title:Last(Production_Master).Title+1,\r\n            Plant_ID:PID,\r\n            Facility:facilityID,\r\n            //Plant_facility:PID & \" - \" & facilityID,\r\n            User_Name: Office365Users.MyProfileV2().displayName,\r\n            Date:DateValue(CDate),\r\n            W_Date:CDate-Weekday(DateValue(CDate),3),\r\n            Production:Text(CRun),\r\n            Serial:Text(CItem),\r\n            Model:Text(CModel),\r\n            report_by_floor:VAR_by_floor,\r\n            Home_Type:Text(CFloor),\r\n            Combined_Size:Text(CSize),\r\n            Reviewed:If(CDate=\"\",\"\",\"No\"),\r\n\r\n            WFeet:Value(If(IsMatch(CRWide,\"'\",MatchOptions.Contains),Left(CRWide,Find(\"'\",CRWide)-1),CRWide)),\r\n            WInches:Value(If(Len(CRWide)=2,\r\n                0,\r\n                Left(Mid(CRWide,Find(\"'\",CRWide)+1),2))),\r\n                \r\n            LFeet:Value(If(IsMatch(CRLength,\"'\",MatchOptions.Contains),Left(CRLength,Find(\"'\",CRLength)-1),CRLength)),\r\n            LInches:Value(If(Len(CRLength)=2,\r\n                0,\r\n                Left(Mid(CRLength,Find(\"'\",CRLength)+1),2))),\r\n\r\n            Roof_RValue:Value(CRValue)            \r\n        }\r\n    ))\r\n;\r\n\r\nClear(Col3Dim);\r\nUpdateContext({show_floor_question: false});\r\nNavigate(review_screen1,ScreenTransition.Fade);\r\n\r\n\r\n\r\n//UpdateContext({show_floor_question: true})\r\n"
