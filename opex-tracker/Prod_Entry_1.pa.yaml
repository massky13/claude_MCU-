      - Button1:
          Control: Classic/Button
          Properties:
            BorderThickness: =0
            Fill: =RGBA(2, 66, 109, 1)
            OnSelect: |+
              =Clear(Col1Dim);
              ForAll(ForAll(Split(Text1.Text,Char(10)), {Result: ThisRecord.Value}),
              Collect(Col1Dim,Table({
              CDate:First(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value})).Result,
              CProduction:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),2)).Result,
              CSerial:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),3)).Result,
              CModel:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),4)).Result,
              CType:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),5)).Result,
              CRValue:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),6)).Result,
              CWFeet:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),7)).Result,
              CWInches:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),8)).Result,
              CLFeet:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),9)).Result,
              CLInches:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),10)).Result,
              CPWFeet:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),11)).Result,
              CPWInches:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),12)).Result,
              CPLFeet:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),13)).Result,
              CPLInches:Last(FirstN(ForAll(Split(Result,Char(9)), {Result: ThisRecord.Value}),14)).Result
