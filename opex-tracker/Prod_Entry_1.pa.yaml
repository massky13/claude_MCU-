            - CDate_Column1:
                Control: DataTableColumn
                Variant: Textual
                Properties:
                  AutoWidth: =false
                  FieldDisplayName: ="Date"
                  FieldName: ="CDate"
                  Order: =1
                  Text: =ThisItem.CDate
                  Width: =110
            - CProduction_Column1:
                Control: DataTableColumn
                Variant: Textual
