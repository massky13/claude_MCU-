                          Production:Text(CProduction),
                          Serial:Text(CSerial),
                          Model:Text(CModel),
                          Home_Type:Text(CType),
                          report_by_floor:VAR_by_floor,
                          Roof_RValue:Value(CRValue),
                          LFeet:Value(CLFeet),
                          LInches:Value(CLInches),
                          WFeet:Value(CWFeet),
                          WInches:Value(CWInches),
