                Properties:
                  AutoWidth: =false
                  FieldDisplayName: ="Floor Size"
                  FieldName: ="CPLFeet"
                  Order: =3
                  Text: =RoundUp((ThisItem.CWFeet + ThisItem.CWInches/12),1) & " x " & RoundUp((ThisItem.CLFeet + ThisItem.CLInches/12),1)
                  Width: =97
            - CRValue_Column1:
                Control: DataTableColumn
                Variant: Textual
                Properties:
                  AutoWidth: =false
                  FieldDisplayName: ="RValue"
                  FieldName: ="CRValue"
                  Order: =7
                  Text: =ThisItem.CRValue
                  Width: =84
