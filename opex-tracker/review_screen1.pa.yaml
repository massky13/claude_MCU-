            OnSelect: "=If(\r\n    // Check if any gallery item has zero width or zero length\r\n    CountIf(\r\n        NewDataGallery_2.AllItems,\r\n        Value(ThisRecord.LFeet_1txt.Text)+Value(ThisRecord.LInches_1txt.Text)/12 = 0\r\n        Or\r\n        Value(ThisRecord.WFeet_1txt.Text)+Value(ThisRecord.WInches_1txt.Text)/12 = 0\r\n    ) > 0,\r\n\r\n    // FAIL: Notify and stop\r\n    Notify(\r\n        \"One or more records have zero Width or Length. Please review before submitting.\",\r\n        NotificationType.Error\r\n    ),\r\n    // Check 2: Width exceeds 18 feet\r\n    CountIf(\r\n        NewDataGallery_2.AllItems,\r\n        Value(ThisRecord.WFeet_1txt.Text)+Value(ThisRecord.WInches_1txt.Text)/12 > 18\r\n    ) > 0,\r\n    Notify(\r\n        \"A floor width cannot be over 18 feet!\",\r\n        NotificationType.Error\r\n    ),\r\n    // Check 3: Date out of allowed range\r\n    DateValue(date_gal_txt.Text) < (DateAdd(Today(), -4, TimeUnit.Months))\r\n    Or\r\n    DateValue(date_gal_txt.Text) > (DateAdd(Today(), 1, TimeUnit.Months)),\r\n    Notify(\r\n        \"Date must be within 4 months in the past and 1 month in the future.\",\r\n        NotificationType.Error\r\n    ),\r\n\r\n\r\n    // PASS: Proceed with all patches\r\n    ForAll(NewDataGallery_2.AllItems,\r\n\r\n        Patch(Production_Master,Defaults(Production_Master),\r\n        //ThisRecord,\r\n            {\r\n                Title:ThisRecord.Title,\r\n                Date:ThisRecord.Date,\r\n                Plant_ID:ThisRecord.Plant_ID,\r\n                Facility:ThisRecord.Facility,\r\n                //Plant_Facility:ThisRecord.Plant_ID & \" - \" & ThisRecord.Facility,\r\n                User_Name:User().FullName,\r\n                W_Date:Date-Weekday(DateValue(date_gal_txt.Text),3),\r\n                Production:ThisRecord.Prod_txt.Text,\r\n                Serial:ThisRecord.Serial_txt.Text,\r\n                Model:ThisRecord.Model_txt.Text,\r\n                Home_Type:ThisRecord.type_txt.Text,\r\n                Section:ThisRecord.Dropdown3.SelectedText.Value,\r\n                Roof_RValue:Value(ThisRecord.RRoof.Text),\r\n                LFeet:Value(ThisRecord.LFeet_1txt.Text),\r\n                LInches:Value(ThisRecord.LInches_1txt.Text),\r\n                WFeet:Value(ThisRecord.WFeet_1txt.Text),\r\n                WInches:Value(ThisRecord.WInches_1txt.Text),\r\n                HFeet:Value(ThisRecord.HFeet_1txt.Text),\r\n                HInches:Value(ThisRecord.HInches_1txt.Text),\r\n                Reviewed:\"Yes\",\r\n                Review_By: User().FullName \r\n            }\r\n            );\r\n        Patch(Insulation_Roofs,\r\n            Defaults(Insulation_Roofs),\r\n                {\r\n                    Title:ThisRecord.Title,\r\n                    Plant_ID:Value(plantID_txt.Text),\r\n                    Facility_ID:ThisRecord.Facility,\r\n                    //Plant_facility:Value(plantID_txt.Text) & \" - \" & Value(facility_txt.Text),\r\n                    User_Name: Office365Users.MyProfileV2().displayName,\r\n                    Date:DateValue(date_gal_txt.Text),\r\n                    W_Date:Date-Weekday(DateValue(date_gal_txt.Text),3),\r\n                    Production:Prod_txt.Text,\r\n                    Serial:Serial_txt.Text,\r\n                    Model:Model_txt.Text,\r\n                    Type:type_txt.Text,\r\n                    Section:Dropdown3.SelectedText.Value,\r\n                    Length:Value(LFeet_1txt.Text)+Value(LInches_1txt.Text)/12,\r\n                    Width:If(Value(LFeet_1txt.Text)+Value(LInches_1txt.Text)/12 > 18,(Value(WFeet_1txt.Text)+Value(WInches_1txt.Text)/12)/2,Value(WFeet_1txt.Text)+Value(WInches_1txt.Text)/12),\r\n                    PWidth:Value(PWFeet_1txt.Text)+Value(PWInch_1txt.Text)/12,\r\n                    PLength:Value(PLFeet_1txt.Text)+Value(PLInch_1txt.Text)/12,\r\n                    Edited: \"No\",\r\n                    RValue: Value(RRoof.Text),\r\n                    BagsReq:0\r\n                }\r\n        );\r\n        Patch(roofs_alldetails,\r\n            Defaults(roofs_alldetails),\r\n                {\r\n                    Title:ThisRecord.Title,\r\n                    PlantID:Value(plantID_txt.Text),\r\n                    Facility:ThisRecord.Facility,\r\n                    //Plant_facility:Value(plantID_txt.Text) & \" - \" & Value(facility_txt.Text),\r\n                    User_Name: Office365Users.MyProfileV2().displayName,\r\n                    Date:DateValue(date_gal_txt.Text),\r\n                    W_Date:Date-Weekday(DateValue(date_gal_txt.Text),3),\r\n                    Production:Prod_txt.Text,\r\n                    Serial:Serial_txt.Text,\r\n                    Model:Model_txt.Text,\r\n                    TypeX:type_txt.Text,\r\n                    Length:Value(LFeet_1txt.Text)+Value(LInches_1txt.Text)/12,\r\n                    Width:Value(WFeet_1txt.Text)+Value(WInches_1txt.Text)/12,\r\n                    Height:Value(HFeet_1txt.Text)+Value(HInches_1txt.Text)/12,\r\n                    PWidth:Value(PWFeet_1txt.Text)+Value(PWInch_1txt.Text)/12,\r\n                    PLength:Value(PLFeet_1txt.Text)+Value(PLInch_1txt.Text)/12,\r\n                    Section:Dropdown3.SelectedText.Value,\r\n                    Sections: If(Dropdown3.SelectedText.Value=\"Single\", \"S\",\"M\"),\r\n                    Edited: \"No\",\r\n                    Truss_spacing: 24,\r\n                    ExtraLFT:Value(txt_elft_production.Text)\r\n                }\r\n        )\r\n    );\r\n    Notify(\r\n        \"The production data was recorded successfully.\",\r\n        NotificationType.Success\r\n    );\r\n    Clear(col_production);\r\n    Navigate(Splash_Screen,ScreenTransition.Fade)\r\n);\r\n    \r\n\r\n    //Value(NewDataGallery_2.Selected.WFeet_txt.Text),\r\n    //           WInches:Value(NewDataGallery_2.Selected.WInches_txt.Text),"
