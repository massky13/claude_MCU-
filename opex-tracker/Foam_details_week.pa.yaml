Screens:
  Foam_details_week:
    Properties:
      OnVisible: |
        =Set(var_prod_sections,"null");

        // Start of the 4-month window: the Monday of the week containing the date
        // four calendar months ago. W_Date values are always Mondays, so the
        // boundary is snapped to a week start.
        Set(
            var_week_first,
            With(
                {d: DateAdd(Today(), -4, TimeUnit.Months)},
                d - Weekday(d, 3)
            )
        );

        ClearCollect(
            col_roofs_week_cycles,
            Filter(
                roofs_week_cycles,
                PlantID = PID,
                Facility = VAR_facility,
                pump_name = VAR_pump_name,
                W_Date >= var_week_first
            )
        );

        Set(
            var_week_sel,
            Coalesce(
                First(Sort(col_roofs_week_cycles, W_Date, SortOrder.Descending)).W_Date,
                Today() - Weekday(Today(), 3)
            )
        );

        // Load only the selected week's detail rows. Collecting the whole 4-month
        // window hit the data row limit and dropped rows; the week gallery
        // (roofs_alldetails_gallery_2) reloads this collection on each week click.
        ClearCollect(
            col_roofs_week_details,
            AddColumns(
                SortByColumns(
                    ShowColumns(
                        Filter(
                            roofs_alldetails,
                            PlantID = PID,
                            Facility = VAR_facility,
                            pump_name = VAR_pump_name,
                            W_Date = var_week_sel
                        ),
                        ID,
                        Title,
                        Production,
                        Serial,
                        Sections,
                        Truss_spacing,
                        Cycle1_end,
                        Bead_TopBot,
                        'Date',
                        W_Date,
                        extra_cost,
                        LFT_LB,
                        Missing,
                        pump_name
                    ),
                    "ID",
                    SortOrder.Ascending
                ),
                _dirty,
                false,
                ToDelete,
                false
            )
        );

        ClearCollect(col_pumps, Distinct(Filter('plant-pumps',Plant_ID=PID,Facility=VAR_facility),pump_name));
