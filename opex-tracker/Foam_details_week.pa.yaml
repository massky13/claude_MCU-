                              VAR_last_w_cycles,
                              LookUp(
                                  roofs_week_cycles,
                                  W_Date = var_week_sel - 7,
                                  Cycles
                              )
                          );
                          With(
                              {weekRows: Filter(col_roofs_week_details, W_Date = var_week_sel)},
                              Set(
                                  VAR_cycles_floor,
                                  Value(roofs_alldetails_gallery_2.Selected.Cycles) / CountRows(weekRows)
                              );
                              Set(
                                  VAR_week_lft,
                                  Value(roofs_alldetails_gallery_2.Selected.week_lft) / CountRows(weekRows)
                              );
                              ForAll(
                                  weekRows As row,
                                  IfError(
                                      Patch(
                                          roofs_alldetails,
                                          LookUp(roofs_alldetails, ID = row.ID),
                                          {
                                              Date: row.Date,
                                              W_Date: row.W_Date,
                                              Sections: If(
                                                  var_prod_sections = "null",
                                                  row.Sections,
                                                  var_prod_sections
                                              ),
                                              Truss_spacing: Value(row.Truss_spacing),
                                              ExtraLFT: VAR_week_lft,
                                              Cycle1_start: 0,
                                              Cycle1_end: VAR_cycles_floor,
                                              Edited: "Yes",
                                              Missing: Coalesce(row.Missing, false),
                                              cyclesPP: VAR_cyclesPP,
                                              dollarsPP: VAR_dollarsPP,
                                              foam_trussendwall: Value(VAR_ToverEW),
                                              foam_oversidewalls: VAR_EBoverSW,
                                              targetLFTPP: VAR_targetFPP,
                                              foam_name: VAR_foam_name,
                                              pump_name: Coalesce(row.pump_name, VAR_pump_name)
                                          }
                                      ),
                                      Collect(
                                          colApplyErrors,
                                          {
                                              ID: row.ID,
                                              Message: FirstError.Message
                                          }
                                      );
                                      Blank()
                                  )
                              )
                          );
