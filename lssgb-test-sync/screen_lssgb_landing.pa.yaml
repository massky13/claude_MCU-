                              - Card2_10:
                                  Control: ModernCard
                                  Properties:
                                    HeaderImage: =
                                    X: =303
                                    Y: =28
                              - Card2_11:
                                  Control: ModernCard
                                  Properties:
                                    HeaderImage: =
                                    X: =749
                                    Y: =28
                        - Text3_1:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              LayoutMaxHeight: =50
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =24
                              Text: ="Lean Six Sigma Green Belt Certification Exam"
                              Width: =600
                        - Container9_1:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                            Children:
                              - Image1_1:
                                  Control: Image
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =520
                                    Image: ='LSSGB medal'
                                    Width: =321
                                    X: =58
                                    Y: =(Parent.Height-Self.Height)/2
                              - Text5_1:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    Size: =18
                                    Text: ="Welcome to the exam portion of the certification process."
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =534
                                    X: =471
                                    Y: =35
                              - Text6_1:
                                  Control: ModernText
                                  Properties:
                                    Height: =293
                                    Size: =18
                                    Text: |-
                                      ="Instructions:
                                       - You will have 2 hours to answer 100 questions.
                                       - The questions cover the Green Belt materials by OpEx.
                                       - The passing score is 70%.
                                       - You will have a maximum of 3 attempts to pass the test.
                                       - At the end of the test you will see a report with your result.
                                       - Click the Start button below to begin."
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =534
                                    X: =471
                                    Y: =111
                              - ButtonCanvas3_1:
                                  Control: Button
                                  Properties:
                                    BasePaletteColor: =RGBA(2, 66, 109, 1)
                                    FontSize: =18
                                    Height: =61
                                    OnSelect: |-
                                      =ClearCollect(col_lssgb_questions, Filter(lss_questions, exam="LSSGB"));
                                      ClearCollect(col_lssgb_sessions, Filter(lss_sessions,UserEmail=User().Email));
                                      Set(varElapsedSeconds, 0);
                                      Set(varIsCompleted, false);
                                      Set(varSelectedAnswer, "");
                                      Set(varAttemptNumber, Max(Filter(col_lssgb_sessions, UserEmail = Lower(User().Email)),AttemptNumber));


                                      Set(varIsPaused, false);
                                      Set(varElapsedAtPause, 0);


                                      // Store session ID for later updates
                                      Set(varSessionID, varSession.ID);

                                      // Write session record to SharePoint immediately on Start
                                      Set(
                                          varSession,
                                          Patch(
                                              lss_sessions,
                                              Defaults(lss_sessions),
                                              {
                                                  Title: User().FullName & " - " & Text(Now(), "yyyy-mm-dd hh:mm"),
                                                  UserEmail: Lower(User().Email),
                                                  StartTime: Now(),
                                                  PausedTime: Blank(),
                                                  ElapsedSeconds: 0,
                                                  IsPaused: false,
                                                  IsCompleted: false,
                                                  AttemptNumber: varAttemptNumber,
                                                  SessionStatus: {Value: "In Progress"},
                                                  TotalQuestions: 100,
                                                  Passed: false,
                                                  CompletedDate: Blank()
                                              }
                                          )
                                      );



                                      // Initialize in-memory session mirror
                                      ClearCollect(colSession, varSession);


                                      Navigate(screen_LSSGB, ScreenTransition.Fade)
                                    Text: ="Start"
                                    Visible: =!LookUp(lss_cetificates,UserEmail=User().Email,TestDone)
                                    Width: =157
                                    X: =659
                                    Y: =465
