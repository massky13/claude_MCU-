                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                              - ButtonCanvas1_1:
                                  Control: Button
                                  Properties:
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({add_person:false})
                                    Text: ="Close"
                                    Width: =120
                              - Rectangle4:
                                  Control: Rectangle
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                              - ButtonCanvas1:
                                  Control: Button
                                  Properties:
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =With(
                                          {
                                              _email: Lower(Coalesce(varSelectedEmployee.Mail, varSelectedEmployee.UserPrincipalName)),
                                              _name: varSelectedEmployee.DisplayName
                                          },
                                          If(
                                              IsBlank(varSelectedEmployee) || IsBlank(varSelectedEmployee.Id),
                                              Notify("Please find and select an employee first.", NotificationType.Warning),

                                              If(
                                                  !IsBlank(
                                                      LookUp(
                                                          lss_cetificates,
                                                          UserEmail = _email
                                                      )
                                                  ),
                                                  Notify("This employee already exists in the certification list.", NotificationType.Warning),

                                                  ClearCollect(
                                                      colRandomNumberCandidates,
                                                      AddColumns(
                                                          Sequence(50),
                                                          CandidateNumber,
                                                          RandBetween(0, 9999)
                                                      )
                                                  );

                                                  Set(
                                                      varAvailableNumber,
                                                      First(
                                                          Filter(
                                                              colRandomNumberCandidates,
                                                              IsBlank(
                                                                  LookUp(
                                                                      lss_cetificates,
                                                                      Number = CandidateNumber
                                                                  )
                                                              )
                                                          )
                                                      ).CandidateNumber
                                                  );

                                                  If(
                                                      IsBlank(varAvailableNumber),
                                                      Notify("Could not generate an available certificate number. Please try again.", NotificationType.Error),

                                                      With(
                                                          {
                                                              _newRecord: Patch(
                                                                  lss_cetificates,
                                                                  Defaults(lss_cetificates),
                                                                  {
                                                                      Title: varAvailableNumber,
                                                                      Number: varAvailableNumber,
                                                                      UserEmail: _email,
                                                                      UserName: _name,
                                                                      type: {Value: type_filter_1.SelectedText.Value},
                                                                      role: {Value: "user"},
                                                                      TrainingDone: false,
                                                                      TestDone: false,
                                                                      ProjectDone: false,
                                                                      award: false
                                                                  }
                                                              )
                                                          },
                                                          Notify(
                                                              "Employee added successfully. Assigned number: " & Text(_newRecord.Number),
                                                              NotificationType.Success
                                                          );
                                                          Reset(txtEmployeeSearch);
                                                          Clear(colEmployeeResults);
                                                          Clear(colRandomNumberCandidates);
                                                          Set(varSelectedEmployee, Blank());
                                                          Set(varAvailableNumber, Blank())
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                    Text: ="Add to Roster"
                                    Width: =120
                              - Rectangle4_1:
                                  Control: Rectangle
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 0, 0, 0)
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
