                        - Text1_10:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =50
                              OnSelect: =
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: =CountRows(Filter(colResponses,UserEmail=User().Email,!IsBlank(SelectedAnswer))) & " / " & CountRows(Filter(colResponses,UserEmail=User().Email))
                              Width: =Parent.Width*0.8
                              Wrap: =false
                              X: =40
                              Y: =70
                        - Timer2:
                            Control: Timer
                            Properties:
                              AutoStart: =true
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                              DisabledColor: =ColorFade(Self.Fill, 90%)
                              DisabledFill: =ColorFade(Self.Fill, 70%)
                              Duration: =1000
                              Fill: =RGBA(56, 96, 178, 1)
                              Font: =Font.'Open Sans'
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnTimerEnd: |-
                                =Set(varElapsedSeconds, varElapsedSeconds + 1);

                                // Periodic session save every 60 seconds (resilience)
                                If(
                                    Mod(varElapsedSeconds, 300) = 0,
                                    Patch(
                                        lss_sessions,
                                        LookUp(lss_sessions, ID = varSessionID),
                                        {
                                            ElapsedSeconds: varElapsedSeconds,
                                            IsPaused:       false
                                        }
                                    )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Repeat: =true
                              Start: =varIsReady && !varIsPaused && !varIsCompleted
                              Visible: =false
                              X: =40
                              Y: =40
