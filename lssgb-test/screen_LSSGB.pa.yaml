                                              "<td style='padding:8px; border:1px solid #ddd;'>80%</td></tr>" &
                                              "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Duration</strong></td>" &
                                              "<td style='padding:8px; border:1px solid #ddd;'>" & Text(Time(0, 0, varElapsedSeconds), "hh:mm:ss") & "</td></tr>" &
                                              "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Attempt</strong></td>" &
                                              "<td style='padding:8px; border:1px solid #ddd;'>#" & LookUp(lss_sessions, ID = varSessionID).AttemptNumber & "</td></tr>" &
                                              "</table>" &
                                              "<p>Next step: complete your approved DMAIC project to earn your certificate.</p>",
                                              {IsHtml: true}
                                          ),

                                          // Send email — NOT PASSED
                                          Office365Outlook.SendEmailV2(
                                              User().Email & ";" & "massky@gmail.com" & ";ralfonzo@skylinehomes.com",
                                              "LSSGB Certification Exam — Results",
                                              "<h2 style='color:#DC3545;'>Exam Results for " & User().FullName & "</h2>" &
                                              "<p>Unfortunately, the passing threshold of 80% was not met on this attempt.</p>" &
                                              "<table style='border-collapse:collapse; width:400px;'>" &
                                              "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Score</strong></td>" &
                                              "<td style='padding:8px; border:1px solid #ddd;'>" & varFinalScore & " / 100 (" & varScorePercent & "%)</td></tr>" &
                                              "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Passing Threshold</strong></td>" &
                                              "<td style='padding:8px; border:1px solid #ddd;'>80%</td></tr>" &
