Screens:
  screen_LSSGB:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=Set(varIsReady, false);\r\nSet(varUserEmail, Lower(User().Email));\r\nIf(\r\n    // FIRST time taking the test, write to local collection and SharePoint\r\n    IsEmpty(Filter(lss_responses,UserEmail=varUserEmail, exam=\"LSSGB\", SessionID=varSessionID)),\r\n\r\n    ClearCollect(\r\n        col_lssgb_shuffled,\r\n        Sort(\r\n            AddColumns(col_lssgb_questions, RandKey, Rand()),\r\n            RandKey \r\n        )\r\n    );\r\n    ClearCollect(\r\n        colResponses,\r\n        ForAll(\r\n            Sequence(100),\r\n            {\r\n                Title: varSessionID & \".\" & User().EntraObjectId & \".\" & Last(FirstN(col_lssgb_shuffled, Value)).Title,\r\n                exam: \"LSSGB\",\r\n                SessionID: varSessionID,\r\n                UserEmail: varUserEmail,\r\n                QuestionID:      Last(FirstN(col_lssgb_shuffled, Value)).Title,\r\n                QuestionNumber:  Value,\r\n                SelectedAnswer:  \"\",\r\n                IsCorrect:       false,\r\n                AttemptNumber: 1\r\n                //AnswerTimestamp: \r\n                \r\n            }\r\n        )\r\n    );\r\n    ForAll(colResponses As row,\r\n        Patch(\r\n            lss_responses, Defaults(lss_responses),\r\n            {\r\n                Title: row.Title,\r\n                exam: \"LSSGB\",\r\n                SessionID: varSessionID,\r\n                UserEmail: varUserEmail,\r\n                QuestionID:      row.QuestionID,\r\n                QuestionNumber:  row.QuestionNumber,\r\n                SelectedAnswer:  \"\",\r\n                IsCorrect:       false,\r\n                AttemptNumber: 1\r\n                //AnswerTimestamp: Blank() \r\n                \r\n            }\r\n        )\r\n    ),\r\n    // THERE IS DATA IN SHAREPOINT, not the first time taking the test\r\n    ClearCollect(colResponses, Filter(lss_responses,exam=\"LSSGB\", UserEmail=varUserEmail, SessionID=varSessionID))\r\n\r\n);\r\nSet(\r\n    var_question_number,\r\n    Coalesce(\r\n        LookUp(\r\n            Sort(colResponses, QuestionNumber, SortOrder.Ascending),\r\n            IsBlank(SelectedAnswer)\r\n        ).QuestionNumber,\r\n        1\r\n    )\r\n);\r\n\r\n\r\nSet(var_question_ID,LookUp(colResponses, QuestionNumber=var_question_number,QuestionID));\r\nSet(varCurrentQ, LookUp(col_lssgb_questions, Title = var_question_ID));\r\n\r\n\r\n\r\n// Restore elapsed time from saved session\r\nSet(varElapsedSeconds, Coalesce(LookUp(lss_sessions, ID = varSessionID).ElapsedSeconds, 0));\r\nSet(varIsPaused, false);\r\nSet(varIsReady, true);"
    Children:
      - main_container:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - cont_header:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(2, 66, 109, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =75
                  LayoutMinHeight: =75
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =8
                  X: =40
                  Y: =40
                Children:
                  - Image2:
                      Control: Image
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =50
                        Image: ='Opex Logo vertical white nobg'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =25
                        RadiusBottomRight: =25
                        RadiusTopLeft: =25
                        RadiusTopRight: =25
                        Width: =50
                  - Label2:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =20
                        Size: =18
                        Text: ="Lean Six Sigma Green Belt Certification Exam"
                        Width: =600
                  - Timer1:
                      Control: Timer
                      Properties:
                        AutoStart: =true
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                        DisabledColor: =ColorFade(Self.Fill, 90%)
                        DisabledFill: =ColorFade(Self.Fill, 70%)
                        Duration: =varRemainingSeconds * 1000
                        Fill: =RGBA(56, 96, 178, 1)
                        Font: =Font.'Open Sans'
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnTimerEnd: |-
                          =If(
                              !varIsCompleted,
                              Notify("Time is up! Your exam is being submitted.", NotificationType.Warning);
                              Set(varIsCompleted, true);
                              Set(varIsPaused, true);

                              Set(varFinalScore, CountRows(Filter(colResponses, IsCorrect = true)));
                              Set(varScorePercent, Round((varFinalScore / 100) * 100, 1));
                              Set(varPassed, varScorePercent >= 80);

                              Patch(
                                  lss_sessions,
                                  LookUp(lss_sessions, ID = varSessionID),
                                  {
                                      ElapsedSeconds:  varElapsedSeconds,
                                      IsCompleted:     true,
                                      SessionStatus:   {Value: "Completed"},
                                      CorrectAnswers:  varFinalScore,
                                      ScorePercent:    varScorePercent,
                                      Passed:          varPassed,
                                      CompletedDate:   Now()
                                  }
                              );

                              Patch(lss_cetificates, LookUp(lss_cetificates, UserEmail = varUserEmail), {TestDone: true});

                              If(
                                  varPassed,
                                  Office365Outlook.SendEmailV2(
                                      User().Email & ";" & "massky@gmail.com" & ";ralfonzo@skylinehomes.com",
                                      "LSSGB Certification Exam — PASSED",
                                      "<h2 style='color:#28A745;'>Congratulations, " & User().FullName & "!</h2>" &
                                      "<p>You have <strong>passed</strong> the Lean Six Sigma Green Belt certification exam.</p>" &
                                      "<table style='border-collapse:collapse; width:400px;'>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Score</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>" & varFinalScore & " / 100 (" & varScorePercent & "%)</td></tr>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Passing Threshold</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>80%</td></tr>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Duration</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>" & Text(Time(0, 0, varElapsedSeconds), "hh:mm:ss") & "</td></tr>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Attempt</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>#" & LookUp(lss_sessions, ID = varSessionID).AttemptNumber & "</td></tr>" &
                                      "</table>" &
                                      "<p>Next step: complete your approved DMAIC project to earn your certificate.</p>",
                                      {IsHtml: true}
                                  ),
                                  Office365Outlook.SendEmailV2(
                                      User().Email & ";" & "massky@gmail.com" & ";ralfonzo@skylinehomes.com",
                                      "LSSGB Certification Exam — Results",
                                      "<h2 style='color:#DC3545;'>Exam Results for " & User().FullName & "</h2>" &
                                      "<p>Unfortunately, the passing threshold of 80% was not met on this attempt.</p>" &
                                      "<table style='border-collapse:collapse; width:400px;'>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Score</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>" & varFinalScore & " / 100 (" & varScorePercent & "%)</td></tr>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Passing Threshold</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>80%</td></tr>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Duration</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>" & Text(Time(0, 0, varElapsedSeconds), "hh:mm:ss") & "</td></tr>" &
                                      "<tr><td style='padding:8px; border:1px solid #ddd;'><strong>Attempt</strong></td>" &
                                      "<td style='padding:8px; border:1px solid #ddd;'>#" & LookUp(lss_sessions, ID = varSessionID).AttemptNumber & "</td></tr>" &
                                      "</table>" &
                                      "<p>Please review the training material and try again when ready. You've got this!</p>",
                                      {IsHtml: true}
                                  )
                              );

                              Navigate(screen_results, ScreenTransition.Fade)
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Start: =varIsReady && !varIsPaused && !varIsCompleted
                        X: =749
                        Y: =35
                  - Label1:
                      Control: Label
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =18
                        Text: |-
                          ="⏱ "&

                          Text(
                              Time(0, 0, (Timer1.Duration - Timer1.Value) / 1000),
                              "hh:mm:ss"
                          )
                        X: =361
                        Y: =35
                  - Image4:
                      Control: Image
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =60
                        Image: =User().Image
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =30
                        RadiusBottomRight: =30
                        RadiusTopLeft: =30
                        RadiusTopRight: =30
                        Width: =60
            - BottomContainer1_2:
                Control: GroupContainer
                Variant: AutoLayout
