                        - Text1_12:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =50
                              OnSelect: |-
                                =If(
                                    varIsPaused,
                                    // RESUME — restart the clock from now
                                    Set(varIsPaused, false);
                                    Set(varTimerStart, Now());
                                    Patch(colSession, First(colSession), {IsPaused: false}),

                                    // PAUSE — freeze elapsed seconds, stop the clock
                                    Set(varElapsedAtPause, varElapsedAtPause + DateDiff(varTimerStart, Now(), TimeUnit.Seconds));
                                    Set(varIsPaused, true);
                                    Patch(colSession, First(colSession), {
                                        IsPaused: true,
                                        ElapsedSeconds: varElapsedAtPause
                                    })
                                )
                              PaddingBottom: =0
                              PaddingLeft: =20
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: ="❚❚ Pause"
                              Width: =Parent.Width*0.8
                              Wrap: =false
                              X: =40
                              Y: =70
                        - Text1_9:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =50
                              OnSelect: =Navigate(screen_main,ScreenTransition.Fade)
                              PaddingBottom: =0
                              PaddingLeft: =20
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: ="➜] Exit"
                              Width: =Parent.Width*0.8
                              Wrap: =false
                              X: =40
                              Y: =70
                        - Rectangle2_2:
                            Control: Rectangle
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =1
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width
                        - Rectangle2_6:
                            Control: Rectangle
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(0, 0, 0, 0)
                              FillPortions: =1
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width
                        - Text1_15:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =50
