                    =// Built as rows so the label/value pairs cannot drift out of alignment
                    // the way eight separately positioned labels would.
                    Table(
                      {lbl: "Production number", val:
                          If(IsBlank(varPrintFloor), "-", Text(varPrintFloor.Home_number, "0")),
                       lbl2: "Model", val2:
                          Coalesce(varPrintFloor.Model, "-")},
                      {lbl: "Floor", val:
