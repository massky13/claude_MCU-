                Properties:
                  Align: =Align.Right
                  Color: =TextSecondary
                  Height: =20
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: ="Electrical  .  Plumbing  .  Gas   |   Per-floor first-time-pass record"
                  Width: =450
                  Wrap: =false
                  X: =318
                  Y: =78
            - rect_pr_rule_top_1:
