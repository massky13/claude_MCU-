                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.Test_name
                              Width: =148
                              Wrap: =false
                              X: =12
                        - lbl_pr_test_proc:
                            Control: ModernText
                            Properties:
                              Color: =TextSecondary
                              Height: =42
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: |-
                                =Concat(
                                    Sort(Filter(col_type, Test_ID = Value(ThisItem.Title)), Sort_order),
                                    Type_name & " (" & QP_ref & ")", ",  ")
                              Width: =400
                              Wrap: =false
                              X: =160
                        - lbl_pr_test_result:
                            Control: ModernText
                            Properties:
                              Align: =Align.Right
                              Color: |-
                                =With({r: Switch(Value(ThisItem.Title),
                                                 1, varPrintFloor.Elec_result,
                                                 2, varPrintFloor.Plumb_result,
                                                 3, varPrintFloor.Gas_result)},
                                    If(r = 1, StatusGoodColor, r = 0, AlertRed, TextMuted))
                              FontWeight: =FontWeight.Bold
                              Height: =42
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =// Glyph plus word, never colour alone (CLAUDE.md §11) - this sheet
                                // gets printed in black and white as often as not.
                                With({r: Switch(Value(ThisItem.Title),
                                                1, varPrintFloor.Elec_result,
                                                2, varPrintFloor.Plumb_result,
                                                3, varPrintFloor.Gas_result)},
                                    If(r = 1, "PASS", r = 0, "FAIL", "NOT TESTED"))
                              Width: =548
                              Wrap: =false
                              X: =160
                        - rect_pr_test_sep:
                            Control: Rectangle
                            Properties:
                              Fill: =GridLine
                              Height: =1
                              Width: =720
                              Y: =41
                  - rect_pr_rule_s3:
