      - cnt_pr_actions:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Regular
            Fill: =CardBg
            Height: =64
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =10
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =10
            Visible: =!varPrinting
            Width: =Parent.Width
            Y: =Parent.Height - 64
          Children:
            - btn_pr_print:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Print this report"
                  BasePaletteColor: =ChampionBlue
                  Height: =44
                  Icon: ="Print"
                  OnSelect: |-
                    =// Print() hands the rendered screen to the browser's own print dialog. It is
                    // the only built-in method and the most reliable one here - PDF generation
                    // would mean Power Automate, a premium connector and an async round trip.
                    // varPrinting hides this action bar for the render so the buttons do not
                    // appear on the printed sheet.
                    Set(varPrinting, true);
                    Print();
                    Set(varPrinting, false)
                  Text: ="Print"
                  Width: =140
            - btn_pr_close:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Close and return to week detail"
                  Appearance: =ButtonAppearance.Secondary
                  Height: =44
                  Icon: ="Cancel"
                  OnSelect: =Navigate(scr_WeekDetail, ScreenTransition.None)
                  Text: ="Close"
                  Width: =140
