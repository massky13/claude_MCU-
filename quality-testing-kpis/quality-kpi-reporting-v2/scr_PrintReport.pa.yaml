                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="Issued " & Text(Now(), "[$-en-US]mmmm d, yyyy  h:mm AM/PM")
                        Width: =320
                        Wrap: =false
                        X: =448
                        Y: =132
                  - lbl_pr_sec1:
                      Control: ModernText
                      Properties:
                        Color: =ChampionBlue
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
