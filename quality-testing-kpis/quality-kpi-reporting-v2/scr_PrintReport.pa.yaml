                  AutoHeight: =true
                  Color: =ChampionBlue
                  FontWeight: =FontWeight.Bold
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =24
                  Text: ="QUALITY SYSTEM TESTING REPORT"
                  Width: =450
                  Wrap: =false
                  X: =318
                  Y: =44
            - lbl_pr_subtitle_1:
