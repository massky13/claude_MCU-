      - PrintContainer1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =71
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =20
            PaddingTop: =8
            Visible: =!varPrinting
            Width: =794
          Children:
            - btn_pr_print_1:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Print this report"
                  BasePaletteColor: =ChampionBlue
                  Height: =44
                  Icon: ="Print"
                  OnSelect: |-
                    =// Print() hands the rendered screen to the browser's own print dialog. It is
                    // the only built-in method and the most reliable one here - PDF generation
                    // would mean Power Automate, a premium connector and an async round trip.
                    // varPrinting hides this action bar for the render so the buttons do not
                    // appear on the printed sheet.
                    Set(varPrinting, true);
                    Print();
                    Set(varPrinting, false)
                  Text: ="Print"
                  Width: =140
            - btn_pr_close_1:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Close and return to week detail"
                  Appearance: =ButtonAppearance.Secondary
                  Height: =44
                  Icon: ="Cancel"
                  OnSelect: |-
                    =Clear(col_print_defects);
                    Navigate(scr_WeekDetail, ScreenTransition.None)
                  Text: ="Close"
                  Width: =140
            - lbl_pr_hint_1:
                Control: ModernText
                Properties:
                  Color: =TextMuted
                  Height: =44
                  PaddingBottom: =0
                  PaddingLeft: =16
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =11
                  Text: |-
                    =// Orientation, paper size and margins live in the browser print dialog -
                    // Power Apps Print() cannot set them, so the sheet is laid out at exact
                    // Letter portrait dimensions and the operator is told what to pick.
                    "In the print dialog choose:  Letter  .  Portrait  .  Margins: None"
                  Width: =380
                  Wrap: =false
