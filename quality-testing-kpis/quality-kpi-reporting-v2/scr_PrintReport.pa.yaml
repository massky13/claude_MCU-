                        Height: =1
                        Width: =720
                        X: =48
                        Y: =196
                  - gal_pr_ident:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Height: =120
                        Items: |-
                          =// Built as rows so the label/value pairs cannot drift out of alignment
                          // the way eight separately positioned labels would.
                          Table(
                            {lbl: "Production number", val:
                                If(IsBlank(varPrintFloor), "-", Text(varPrintFloor.Home_number, "0")),
                             lbl2: "Model", val2:
                                Coalesce(varPrintFloor.Model, "-")},
                            {lbl: "Floor", val:
                                If(IsBlank(varPrintFloor), "-",
                                   Text(varPrintFloor.Floor_number, "0") & " of " &
                                   Text(Coalesce(varPrintFloor.Floors, 1), "0")),
                             lbl2: "Plant", val2:
                                Text(varPID, "0") & " - " &
                                Coalesce(LookUp(col_plants, Plant_ID = varPID, Plant_Names), "-")},
                            {lbl: "Week ending", val:
                                If(IsBlank(varPrintFloor), "-",
                                   Text(varPrintFloor.Week_end, "[$-en-US]mmmm d, yyyy")),
                             lbl2: "Facility", val2: Text(varFacility, "0")},
                            {lbl: "Entered by", val:
                                Coalesce(varPrintFloor.Entered_by, "-"),
                             lbl2: "Entered at", val2:
                                If(IsBlank(varPrintFloor.Entered_at), "-",
                                   Text(varPrintFloor.Entered_at, "[$-en-US]mm/dd/yyyy h:mm AM/PM"))}
                          )
