Screens:
  scr_PrintReport:
    Properties:
      Fill: =PageBg
      OnVisible: |-
        =// varPrintFloor is set by btn_print_report (scr_WeekDetail) before navigating.
        // Re-read the defects here rather than trusting whatever col_home_defects held:
        // the user may have collapsed or changed the selected floor on the way in.
        Set(varPrinting, false);
        If(!IsBlank(varPrintFloor),
            ClearCollect(col_print_defects,
                Filter(qk_home_defect,
                    Plant_ID = varPID && Home_number = varPrintFloor.Home_number))
        )
    Children:
      - cnt_pr_scroll:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =PageBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - cnt_pr_page:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =1056
                  Width: =816
                Children:
                  - rect_pr_logo:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(243, 244, 242, 1)
                        Height: =64
                        X: =48
                        Y: =40
                  - lbl_pr_logo_hint:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =TextMuted
                        Height: =64
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10
                        Text: ="COMPANY LOGO"
                        Wrap: =false
                        X: =48
                        Y: =40
                  - lbl_pr_title:
                      Control: ModernText
                      Properties:
                        Align: =Align.Right
                        Color: =ChampionBlue
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: ="QUALITY TEST REPORT"
                        Width: =450
                        Wrap: =false
                        X: =318
                        Y: =44
                  - lbl_pr_subtitle:
                      Control: ModernText
                      Properties:
                        Align: =Align.Right
                        Color: =TextSecondary
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Electrical  .  Plumbing  .  Gas   |   Per-floor first-time-through record"
                        Width: =450
                        Wrap: =false
                        X: =318
                        Y: =78
                  - rect_pr_rule_top:
                      Control: Rectangle
                      Properties:
                        Fill: =ChampionBlue
                        Height: =3
                        Width: =720
                        X: =48
                        Y: =120
                  - lbl_pr_refno:
