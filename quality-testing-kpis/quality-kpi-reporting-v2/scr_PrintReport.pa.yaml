                        - lbl_pr_id_l1:
                            Control: ModernText
                            Properties:
                              Color: =TextSecondary
                              Height: =30
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =ThisItem.lbl
                              Width: =130
                              Wrap: =false
                        - lbl_pr_id_v1:
