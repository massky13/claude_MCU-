                             Text(varPrintFloor.Floor_number, "0") & " of " &
                             Text(Coalesce(varPrintFloor.Floors, 1), "0")),
                       lbl2: "Plant", val2:
                          Text(varPID, "0") & " - " &
                          Coalesce(LookUp(col_plants, Plant_ID = varPID, Plant_Names), "-")},
