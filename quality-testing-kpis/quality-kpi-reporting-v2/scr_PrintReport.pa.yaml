                                           1, varPrintFloor.Elec_result,
                                           2, varPrintFloor.Plumb_result,
                                           3, varPrintFloor.Gas_result)},
                              If(r = 1, StatusGoodColor, r = 0, AlertRed, TextMuted))
                        FontWeight: =FontWeight.Bold
                        Height: =42
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |-
                          =// Glyph plus word, never colour alone (CLAUDE.md §11) - this sheet
                          // gets printed in black and white as often as not.
                          With({r: Switch(Value(ThisItem.Title),
                                          1, varPrintFloor.Elec_result,
                                          2, varPrintFloor.Plumb_result,
                                          3, varPrintFloor.Gas_result)},
