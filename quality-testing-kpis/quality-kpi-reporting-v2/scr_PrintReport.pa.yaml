                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =ThisItem.val
                              Width: =210
                              Wrap: =false
                              X: =130
                        - lbl_pr_id_l2:
