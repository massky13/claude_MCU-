Screens:
  scr_CorporateHome:
    Properties:
      Fill: =PageBg
      OnVisible: |-
        =// Refresh when returning from a plant. On the very first visit App.OnStart may still
        // be running (col_plants empty) - skip, OnStart ends by calling LoadCorporateHome().
        If(!IsEmpty(col_plants), LoadCorporateHome());
        Set(varShowInfo, false)
    Children:
      - cnt_root_corp:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cnt_header_corp:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =ChampionBlue
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - cnt_header_left_corp:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - img_logo_corp:
                            Control: Image
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =quality_logo
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Height
                        - lbl_title_corp:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =56
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Quality KPI Reporting - Corporate Overview"
                              Width: =591
                              Wrap: =false
                              X: =70
                  - cnt_header_right_corp:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lbl_loaded_corp:
                            Control: ModernText
                            Properties:
                              Align: =Align.Right
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =User().FullName & ", " & varRole & ". " & If(IsBlank(varCorpLoadedAt), "Loading...", "Loaded " & Text(varCorpLoadedAt, "h:mm AM/PM"))
                              Wrap: =false
                        - icon_header_info:
                            Control: Classic/Icon
                            Properties:
                              AccessibleLabel: ="About First Time Pass Rate"
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(245, 245, 245, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height*2/3
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(16, 110, 190, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.Information
                              LayoutMaxHeight: =50
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Set(varShowInfo, true)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(16, 110, 190, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Tooltip: ="About First Time Pass Rate"
                        - ico_admin_corp:
                            Control: ModernIcon
                            Properties:
                              AccessibleLabel: ="Access Admin"
                              AlignInContainer: =AlignInContainer.Center
                              Icon: ="Settings"
                              IconColor: =RGBA(255, 255, 255, 1)
                              OnSelect: =Navigate(scr_AccessAdmin, ScreenTransition.None)
                              Tooltip: ="Access Admin"
                              Visible: =varIsAdmin
            - cnt_corp_main:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =PageBg
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - gal_regions:
                      Control: Gallery
                      Variant: Horizontal
                      Properties:
                        Items: =Sort(Filter(col_corp_regions, !IsBlank(Region_Name) && Region_Name<>"CAN"),Region_Name)
                        LayoutMaxWidth: =Parent.Width
                        LayoutMinHeight: =0
                        ShowScrollbar: =false
                        TemplatePadding: =12
                        TemplateSize: =(Parent.Width- (8*9))/5   //(Parent.Width-110)/Max(CountRows(Filter(col_corp_regions, !IsBlank(Region_Name) && Region_Name<>"CAN")), 1)
                        Width: =Parent.Width
                      Children:
                        - cnt_region_col:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =If(ThisItem.Region_Name = LookUp(col_corp_plants, Plant_ID = varOwnPID, Plant_Region), ChampionBlue, CardBorder)
                              BorderThickness: =If(ThisItem.Region_Name = LookUp(col_corp_plants, Plant_ID = varOwnPID, Plant_Region), 2, 1)
                              Fill: =CardBg
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth
                            Children:
                              - lbl_region_name:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    Color: =TextPrimary
                                    FontWeight: =FontWeight.Bold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =ThisItem.Region_Name
                                    Wrap: =false
                              - badge_region_metric:
                                  Control: Badge
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Content: |-
                                      =StatusGlyphOf(BandStatusFTPR(ThisItem.Region_FTT)) & " " &
                                          Text(ThisItem.Region_FTT, "0.0") //& "% First Time Pass Rate (last wk)"
                                    Height: =28
                                    LayoutMaxWidth: =50
                                    LayoutMinHeight: =0
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: |-
                                      =If(BandStatusFTPR(ThisItem.Region_FTT) = "good", 'BadgeCanvas.ThemeColor'.Success,
                                          BandStatusFTPR(ThisItem.Region_FTT) = "warning", 'BadgeCanvas.ThemeColor'.Warning,
                                          BandStatusFTPR(ThisItem.Region_FTT) = "nodata", 'BadgeCanvas.ThemeColor'.Subtle,
                                          'BadgeCanvas.ThemeColor'.Danger)
                                    Width: =100
                              - rect_region_sep:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =GridLine
                                    Height: =1
                                    LayoutMinHeight: =0
                                    Width: =Parent.Width-20
                              - gal_region_plants:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    Items: |-
                                      =Sort(
                                          Filter(col_corp_plant_metrics, Plant_Region = ThisItem.Region_Name),
                                          Plant_Name, SortOrder.Ascending)
                                    LayoutMaxWidth: =gal_regions.TemplateWidth
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplateSize: '=50  '
                                    Width: =Parent.Width
                                  Children:
                                    - cnt_plant_row_wrap:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          Height: =Parent.TemplateHeight
                                          Width: =Parent.Width-Parent.X
                                        Children:
                                          - cnt_plant_row:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =If(ThisItem.Plant_ID = varOwnPID, ChampionBlue, GridLine)
                                                BorderThickness: =If(ThisItem.Plant_ID = varOwnPID, 4, 1)
                                                Fill: =If(ThisItem.Plant_ID = varOwnPID, RGBA(156, 212, 234, 0.25), RGBA(0, 0, 0, 0))
                                                Height: =Parent.Height
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =6
                                                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                                PaddingLeft: =4
                                                PaddingRight: =4
                                                Width: =Parent.Width
                                              Children:
                                                - lbl_plant_row_name:
                                                    Control: ModernText
                                                    Properties:
                                                      Color: =TextPrimary
                                                      FontWeight: =If(ThisItem.Plant_ID = varOwnPID, FontWeight.Bold, FontWeight.Semibold)
                                                      Height: =50
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: =ThisItem.Plant_Name //Text(ThisItem.Plant_ID) & " - " & ThisItem.Plant_Name
                                                      Width: =110
                                                      Wrap: =false
                                                - badge_plant_row_metric:
                                                    Control: Badge
                                                    Properties:
                                                      Content: |-
                                                        =StatusGlyphOf(BandStatusFTPR(ThisItem.Plant_FTT)) & " " &
                                                            Text(ThisItem.Plant_FTT, "0.0")
                                                      Height: =30
                                                      LayoutMinWidth: =0
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      ThemeColor: |-
                                                        =If(BandStatusFTPR(ThisItem.Plant_FTT) = "good", 'BadgeCanvas.ThemeColor'.Success,
                                                            BandStatusFTPR(ThisItem.Plant_FTT) = "warning", 'BadgeCanvas.ThemeColor'.Warning,
                                                            BandStatusFTPR(ThisItem.Plant_FTT) = "nodata", 'BadgeCanvas.ThemeColor'.Subtle,
                                                            'BadgeCanvas.ThemeColor'.Danger)
                                                      Width: =60
                                                - lbl_plant_row_stale:
                                                    Control: ModernText
                                                    Properties:
                                                      Align: =Align.Right
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: =If(Coalesce(ThisItem.Plant_Stale_days, 999) > 7, AlertRed, TextMuted)
                                                      FillPortions: =1
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =6
                                                      PaddingTop: =0
                                                      Size: =8
                                                      Text: |-
                                                        =If(IsBlank(ThisItem.Plant_Updated), "n/a",
                                                            ThisItem.Plant_Stale_days > 7,
                                                                Text(ThisItem.Plant_Stale_days, "0") & "d old",
                                                            IsBlank(ThisItem.Plant_Latest_week), "",
                                                            // Which week the headline First Time Pass Rate is actually for. A plant can have been
                                                            // recomputed recently and still be reporting an old week.
                                                            "w. " & Text(
                                                                Date(RoundDown(ThisItem.Plant_Latest_week/10000, 0),
                                                                     Mod(RoundDown(ThisItem.Plant_Latest_week/100, 0), 100),
                                                                     Mod(ThisItem.Plant_Latest_week, 100)),
                                                                "[$-en-US]mm/dd"))
                                                      Width: =78
                                          - btn_plant_overlay:
                                              Control: Classic/Button
                                              Properties:
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Fill: =RGBA(0, 0, 0, 0)
                                                Height: =Parent.Height
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                HoverColor: =RGBA(145, 143, 141, 1)
                                                HoverFill: =RGBA(122, 125, 128, 0.19)
                                                OnSelect: =SelectCorporatePlant(ThisItem.Plant_ID)
                                                PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                PressedColor: =RGBA(145, 143, 141, 1)
                                                PressedFill: =RGBA(2, 66, 109, 0.16)
                                                Text: =""
                                                Tooltip: =If(ThisItem.Plant_ID = varOwnPID || varIsAdmin, "Open plant dashboard", "View plant dashboard (view only)")
                                                Width: =Parent.Width
      - cnt_info_overlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            Visible: =varShowInfo
            Width: =Parent.Width
          Children:
            - rect_info_scrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(11, 11, 11, 0.55)
                  Height: =Parent.Height
                  Width: =Parent.Width
            - btn_info_dismiss:
                Control: Button
                Properties:
                  AccessibleLabel: ="Close information"
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BorderThickness: =0
                  Height: =Parent.Height
                  OnSelect: =Set(varShowInfo, false)
                  Text: =""
                  Width: =Parent.Width
            - cnt_info_card:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Fill: =CardBg
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Min(Parent.Width - 64, 520)
                  X: =(Parent.Width - Self.Width)/2
                  Y: =(Parent.Height - Self.Height)/2
                Children:
                  - lbl_info_title:
                      Control: ModernText
                      Properties:
                        Color: =ChampionBlue
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="About the Company Home Screen"
                        Width: =Parent.Width - 88
                        Wrap: =false
                        X: =24
                        Y: =112
                  - lbl_info_body:
                      Control: ModernText
                      Properties:
                        Color: =TextPrimary
                        Height: =60
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="FPR for the regions is shown for last week. Plants that have not reported it will show the date of the last week they reported"
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =140
                  - ico_info_close:
                      Control: Classic/Icon
                      Properties:
                        AccessibleLabel: ="Close"
                        Color: =TextSecondary
                        Height: =44
                        HoverColor: =ChampionBlue
                        Icon: =Icon.Cancel
                        OnSelect: =Set(varShowInfo, false)
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        Tooltip: ="Close"
                        Width: =44
                        X: =Parent.Width - Self.Width - 8
                        Y: =8
                  - lbl_info_title_1:
                      Control: ModernText
                      Properties:
                        Color: =ChampionBlue
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Key Performance Indicators"
                        Width: =Parent.Width - 88
                        Wrap: =false
                        X: =24
                        Y: =24
                  - lbl_info_body_1:
                      Control: ModernText
                      Properties:
                        Color: =TextPrimary
                        Height: =60
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="First time pass rate (FPR) is calculated by the amount of floors that passed all testing divided by the total number of floors that were tested."
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =52
