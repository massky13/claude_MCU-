                                                Width: =30
                                                X: =Parent.Width - Self.Width-2
                                                Y: =8
                                          - btn_row_edit:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit floor number"
                                                Appearance: =ButtonAppearance.Subtle
                                                DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                                                Height: =40
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =Set(varFEHome, Text(ThisItem.Home_number, "0"));
                                                  Set(varFEFloor, ThisItem.Floor_number);
                                                  Set(varFEFloors, Coalesce(ThisItem.Floors, 1));
                                                  // Reset so the box re-reads varFEHome - otherwise it keeps whatever was
                                                  // typed the last time the popup was opened.
                                                  Reset(txt_fe_floor_id);
