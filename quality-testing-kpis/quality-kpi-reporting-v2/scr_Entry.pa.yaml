                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                            Children:
                              - row_home_header:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - lbl_home_header:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(0, 0, 0, 1)
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =18
                                          Text: |-
                                            =If(varHomeOpen,
                                                "Floor " & varHomeNumberText &
                                                    If(Coalesce(varFloorsOnHome, 1) > 1,
                                                        "  (floor " & Text(varFloorNumber, "0") & " of " &
                                                            Text(varFloorsOnHome, "0") & ")", ""),
                                                "Please select a floor from the list")
                                          Wrap: =false
                                    - btn_save_home:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Save home"
                                          AlignInContainer: =AlignInContainer.Center
                                          BasePaletteColor: =ChampionBlue
                                          DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =40
                                          Icon: ="Save"
                                          Layout: =ButtonLayout.TextOnly
                                          OnSelect: |-
                                            =If(!varHomeOpen,
                                                Notify("Select a floor first.", NotificationType.Error),

                                                (varElecResult = 1 && CountRows(Filter(col_defect_edit, Test_ID = 1)) > 0) ||
                                                (varPlumbResult = 1 && CountRows(Filter(col_defect_edit, Test_ID = 2)) > 0) ||
                                                (varGasResult = 1 && CountRows(Filter(col_defect_edit, Test_ID = 3)) > 0),
                                                Notify("A test marked Pass cannot have defect rows. Remove them or mark the test Fail.",
                                                       NotificationType.Error),

                                                CountRows(col_defect_edit) <> CountRows(Distinct(col_defect_edit, Type_ID & "-" & Defect_ID)),
                                                Notify("Duplicate defect rows found for the same type and defect. Merge them into one row with a combined quantity.",
                                                       NotificationType.Error),

                                                // Raise the saving overlay (cnt_saving_overlay) for the whole
                                                // save -> reload -> rebuild chain, so the user cannot navigate
                                                // away mid-write. Cleared at the end of btn_rebuild_rollups.
                                                // Deliberately AFTER the validation checks above - a rejected
                                                // save never shows it.
                                                Set(varSaving, true);
                                                IfError(
                                                    Patch(qk_home,
                                                        LookUp(qk_home, Plant_ID = varPID && Home_number = varHomeNumberNum),
                                                        {
                                                            Elec_result: varElecResult,
                                                            Plumb_result: varPlumbResult,
                                                            Gas_result: varGasResult
                                                        }
                                                    ); true,
                                                    Notify("Could not save test results. " & FirstError.Message, NotificationType.Error); false
                                                );
                                                // Single batched upsert instead of a per-row ForAll+Patch - one write, one FirstError to check.
                                                IfError(
                                                    Patch(qk_home_defect,
                                                        ForAll(col_defect_edit As DefectRow,
                                                            Coalesce(
                                                                LookUp(qk_home_defect, Plant_ID = varPID && Home_number = varHomeNumberText &&
                                                                    Type_ID = DefectRow.Type_ID && Defect_ID = DefectRow.Defect_ID),
                                                                Defaults(qk_home_defect)
                                                            )
                                                        ),
                                                        ForAll(col_defect_edit As DefectRow, {
                                                            // varHomeNumberText already carries the floor suffix, so this
                                                            // Title stays unique per floor x defect without a floor segment.
                                                            Title: varPID & "." & varFacility & "." & varHomeNumberText & "." & Text(DefectRow.Defect_ID, "0"),
                                                            Plant_ID: varPID, Facility_ID: varFacility, Week_key: varWeekKey,
                                                            Home_number: varHomeNumberText,
                                                            Floor_number: varFloorNumber,
                                                            Test_ID: DefectRow.Test_ID, Type_ID: DefectRow.Type_ID,
                                                            Defect_ID: DefectRow.Defect_ID, Qty: Coalesce(DefectRow.Qty, 1),
                                                            Severity: DefectRow.Severity,
                                                            // Denormalised UNIT cost, parallel to Severity - the extended
                                                            // cost is Qty * Defect_cost, computed where it is needed.
                                                            // Stamping it here is what stops past weeks repricing when
                                                            // an admin edits the taxonomy cost later.
                                                            Defect_cost: Coalesce(DefectRow.Defect_cost,
                                                                LookUp(col_defect_all, Value(Title) = DefectRow.Defect_ID,
                                                                    Defect_cost), 0)
                                                        })
                                                    ); true,
                                                    Notify("Could not save defect rows. " & FirstError.Message, NotificationType.Error); false
                                                );
                                                // Single batched removal of dropped defect rows instead of a per-row ForAll+Remove.
                                                With({varRemovedKeys: AddColumns(col_defect_edit As EditedRow, Key, EditedRow.Type_ID & "-" & EditedRow.Defect_ID).Key},
                                                    IfError(
                                                        Remove(qk_home_defect,
                                                            ForAll(
                                                                Filter(col_home_defects, !(Type_ID & "-" & Defect_ID in varRemovedKeys)) As RemovedRow,
                                                                LookUp(qk_home_defect, Plant_ID = varPID && Home_number = varHomeNumberText &&
                                                                    Type_ID = RemovedRow.Type_ID && Defect_ID = RemovedRow.Defect_ID)
                                                            )
                                                        ); true,
                                                        Notify("Could not remove stale defect rows. " & FirstError.Message, NotificationType.Error); false
                                                    )
                                                );
                                                Notify(
                                                    If(
                                                        (IsBlank(varElecResult) || (varElecResult = 0 && CountRows(Filter(col_defect_edit, Test_ID = 1)) = 0)) ||
                                                        (IsBlank(varPlumbResult) || (varPlumbResult = 0 && CountRows(Filter(col_defect_edit, Test_ID = 2)) = 0)) ||
                                                        (IsBlank(varGasResult) || (varGasResult = 0 && CountRows(Filter(col_defect_edit, Test_ID = 3)) = 0)),
                                                        "Saved - this home has an incomplete or unexplained fail.",
                                                        "Floor saved."
                                                    ),
                                                    NotificationType.Success
                                                );
                                                // Reload the week FIRST so col_homes contains the results just
                                                // saved, then rebuild - same rule as btn_add_home above. Without
                                                // this, btn_rebuild_rollups counted floors from the pre-save
                                                // snapshot, so Floors_tested/Floors_clean (and every FPY figure)
                                                // in qk_week_summary and qk_plant_summary excluded the floor
                                                // just saved - the LAST save of a week was always missing from
                                                // the rollups until something else re-triggered a rebuild.
                                                Select(btn_load_week);
                                                Select(btn_rebuild_rollups)
                                            )
                                          Text: ="Save"
                                          Visible: =varHomeOpen
                                          Width: =120
