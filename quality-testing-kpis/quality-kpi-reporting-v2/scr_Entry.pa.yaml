                  Y: =(Parent.Height - Self.Height)/2
                Children:
                  - lbl_fd_title:
                      Control: ModernText
                      Properties:
                        Color: =TextPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Delete " & varFDHome & "?"
                        Width: =Parent.Width - 48
                        Wrap: =false
                        X: =24
                        Y: =20
                  - lbl_fd_body:
                      Control: ModernText
                      Properties:
                        Color: =TextSecondary
                        Height: =72
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =If(varFDDefects > 0,
                              "This also deletes " & Text(varFDDefects, "0") &
                                  " recorded defect(s) on this floor.",
                              "No defects are recorded on this floor.") &
                          "  This cannot be undone."
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =56
                  - btn_fd_cancel:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =44
                        OnSelect: =Set(varShowFloorDelete, false)
                        Text: ="Cancel"
                        Width: =100
                        X: =Parent.Width - 232
                        Y: =Parent.Height - 64
                  - btn_fd_delete:
                      Control: ModernButton
                      Properties:
                        BasePaletteColor: =AlertRed
                        Height: =44
                        OnSelect: |-
                          =// Defects first: they are keyed by Home_number, so removing the floor
                          // row first would strand them with nothing to point at.
                          IfError(
                              Remove(qk_home_defect,
                                  Filter(qk_home_defect,
                                      Plant_ID = varPID && Home_number = varFDHome)),
                              Notify("Could not remove this floor's defect rows. " &
                                  FirstError.Message, NotificationType.Error)
                          );
                          IfError(
                              Remove(qk_home,
                                  LookUp(qk_home,
                                      Plant_ID = varPID && Home_number = varFDHome)),
                              Notify("Could not delete the floor. " & FirstError.Message,
                                  NotificationType.Error)
                          );
                          Notify("Deleted " & varFDHome & ".", NotificationType.Success);
                          Set(varShowFloorDelete, false);
                          // The detail panel may still be open on the row just deleted.
                          Set(varHomeOpen, false);
                          Select(btn_load_week);
                          Select(btn_rebuild_rollups)
                        Text: ="Delete"
                        Width: =110
                        X: =Parent.Width - 124
                        Y: =Parent.Height - 64
