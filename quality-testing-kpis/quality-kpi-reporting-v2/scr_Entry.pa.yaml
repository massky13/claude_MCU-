Screens:
  scr_Entry:
    Properties:
      Fill: =PageBg
      OnVisible: |-
        =Reset(tabs_main_en);
        Set(varShowFloorEdit, false);
        Set(varShowFloorDelete, false);
        Set(varSaving, false);
        Set(varHomeOpen, Coalesce(varHomeOpen, false));
        Set(varToday, Today());

        // Pre-select the current week - the calendar row that contains today. Only when
        // varWeekKey is still blank, so a week the user picked earlier survives navigating
        // away and back. gal_week_picker highlights whichever button matches varWeekKey,
        // and btn_add_home / the rollup writes read varWeekStart/End + the Fiscal_* vars,
        // so all of them are set together exactly as btn_week_pick.OnSelect does.
        // If no calendar row covers today, varCurWeekRow is blank, varWeekKey stays blank
        // and the load below simply doesn't fire - no bad write.
        Set(varCurWeekRow, LookUp(col_calendar, W_start <= varToday && W_end >= varToday));
        Set(varNeedWeekDefault, IsBlank(varWeekKey) && !IsBlank(varCurWeekRow));
        If(varNeedWeekDefault, Set(varWeekStart, varCurWeekRow.W_start));
        If(varNeedWeekDefault, Set(varWeekEnd, varCurWeekRow.W_end));
        If(varNeedWeekDefault, Set(varFiscalYear, varCurWeekRow.Fiscal_year));
        If(varNeedWeekDefault, Set(varFiscalQuarter, varCurWeekRow.Fiscal_quarter));
        If(varNeedWeekDefault, Set(varWeekNumber, varCurWeekRow.Week));
        If(varNeedWeekDefault, Set(varWeekKey, Value(Text(varCurWeekRow.W_end, "yyyymmdd"))));

        If(!IsBlank(varFacility) && !IsBlank(varWeekKey),
            Select(btn_load_week),
            false
        )
    Children:
      - cnt_root_en:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - cnt_header_en:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ChampionBlue
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - cnt_header_left_en:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - img_logo_en:
                            Control: Image
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =quality_logo
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Height
                        - lbl_title_en:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.Arial
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Quality KPI Reporting"
                              Width: =300
                              Wrap: =false
                  - cnt_header_right_en:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lbl_plant_en:
                            Control: ModernText
                            Properties:
                              Align: =Align.Right
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: |-
                                =If(IsBlank(varPID), "Select a plant",
                                    Text(varPID) & " - " & LookUp(col_plants, Plant_ID = varPID, Plant_Names)) & ", facility:"
                              Wrap: =false
                        - drp_facility_en:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Facility"
                              AlignInContainer: =AlignInContainer.Center
                              Default: =LookUp(col_plants, Plant_ID = varPID && Value(Facility) = 1)
                              ItemDisplayText: =ThisItem.Facility
                              Items: =Sort(Filter(col_plants, Plant_ID = varPID), Value(Facility))
                              OnChange: |-
                                =Set(varFacility, Value(drp_facility_en.Selected.Facility));
                                Set(varHomeOpen, false);
                                Select(btn_load_week)
                              Width: =60
            - cnt_nav_en:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =CardBg
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  Width: =Parent.Width
                Children:
                  - tabs_main_en:
                      Control: ModernTabList
                      Properties:
                        AlignInContainer: =AlignInContainer.End
                        Default: |-
                          ={Value: "Data Entry"}
                        FillPortions: =1
                        Items: |-
                          =If(varIsAdmin,
                              If(!IsBlank(varAccessRow) && varAccessRow.Plant_ID = 0,
                                  Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"}),
                                  Table({Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"})
                              ),
                              If(!IsBlank(varAccessRow) && varAccessRow.Plant_ID = 0,
                                  Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}),
                                  Table({Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"})
                              )
                          )
                        LayoutMinHeight: =38
                        OnChange: |-
                          =If(tabs_main_en.Selected.Value = "Corporate Home", Navigate(scr_CorporateHome, ScreenTransition.None),
                              tabs_main_en.Selected.Value = "Dashboard", Navigate(scr_Dashboard, ScreenTransition.None),
                              tabs_main_en.Selected.Value = "Data Entry", Navigate(scr_Entry, ScreenTransition.None),
                              tabs_main_en.Selected.Value = "Week Detail", Navigate(scr_WeekDetail, ScreenTransition.None),
                              tabs_main_en.Selected.Value = "History", Navigate(scr_History, ScreenTransition.None),
                              tabs_main_en.Selected.Value = "Taxonomy", Navigate(scr_TaxonomyAdmin, ScreenTransition.None),
                              tabs_main_en.Selected.Value = "Access", Navigate(scr_AccessAdmin, ScreenTransition.None))
            - cnt_filters_en:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =CardBg
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - gal_week_picker:
                      Control: Gallery
                      Variant: Horizontal
                      Properties:
                        AccessibleLabel: ="Week ending"
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =100
                        Height: =48
                        Items: |-
                          =Sort(
                              FirstN(
                                  Sort(Filter(col_calendar, W_end <= EntryWeekAnchorEnd), W_end, SortOrder.Descending),
                                  20),
                              W_end, SortOrder.Descending)
                        ShowScrollbar: =false
                        TemplatePadding: =4
                        TemplateSize: =60
                        Width: =616
                      Children:
                        - btn_week_pick:
                            Control: ModernButton
                            Properties:
                              Appearance: =If(Value(Text(ThisItem.W_end, "yyyymmdd")) = varWeekKey, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              BasePaletteColor: =ChampionBlue
                              Height: =Parent.TemplateHeight
                              OnSelect: |-
                                =Set(varWeekStart, ThisItem.W_start);
                                Set(varWeekEnd, ThisItem.W_end);
                                Set(varWeekKey, Value(Text(ThisItem.W_end, "yyyymmdd")));
                                Set(varFiscalYear, ThisItem.Fiscal_year);
                                Set(varFiscalQuarter, ThisItem.Fiscal_quarter);
                                Set(varWeekNumber, ThisItem.Week);
                                Set(varHomeOpen, false);
                                Select(btn_load_week)
                              Text: =Text(ThisItem.W_end, "mmm d")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.TemplateWidth
                  - lbl_loaded_en:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Last loaded timestamp"
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Center
                        Color: =TextMuted
                        FillPortions: =1
                        LayoutMinWidth: =105
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="Week ending on... " & If(IsBlank(varLoadedAt), "", "Loaded " & Text(varLoadedAt, "hh:mm:ss"))
            - cnt_main_en:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =PageBg
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  Width: =Parent.Width
                Children:
                  - btn_load_week:
                      Control: Button
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        Height: =1
                        OnSelect: |-
                          =ClearCollect(col_homes,
                              Filter(qk_home, Plant_ID = varPID && Week_key = varWeekKey && Facility_ID = varFacility));
                          ClearCollect(col_week_defects,
                              Filter(qk_home_defect, Plant_ID = varPID && Week_key = varWeekKey && Facility_ID = varFacility));
                          Set(varLoadedAt, Now());
                          Set(varHomeOpen, false)
                        Text: =""
                        Visible: =false
                        Width: =1
                  - cnt_entry_grid:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =720
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - cnt_week_homes:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =CardBorder
                              BorderThickness: =1
                              Fill: =CardBg
                              FillPortions: =4
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                            Children:
                              - cnt_add_row:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - lbl_progress_1:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =TextSecondary
                                          Height: =18
                                          PaddingBottom: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |-
                                            ="Production: "
                                          Width: =70
                                          Wrap: =false
                                    - txt_home_number:
                                        Control: ModernTextInput
                                        Properties:
                                          AccessibleLabel: ="Home production number (floor suffix is added automatically)"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          FillPortions: =1
                                          LayoutMinWidth: =0
                                          Placeholder: ="e.g. 4471203"
                                    - num_floors:
                                        Control: ModernNumberInput
                                        Properties:
                                          AccessibleLabel: ="Number of floors"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Default: =1
                                          Max: =6
                                          Min: =1
                                          Width: =60
                                    - btn_add_home:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Add home"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BasePaletteColor: =ChampionBlue
                                          DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                                          OnSelect: |-
                                            =// ===== Add a home as one qk_home row PER FLOOR =====
                                            // Home_number itself carries the floor suffix and is the per-floor unique key:
                                            //   1 floor  -> "4471203"        (bare, unchanged)
                                            //   2 floors -> "4471203A", "4471203B"
                                            //   3 floors -> "4471203A", "4471203B", "4471203C"  ... and so on
                                            // Floor_number carries the ordinal (1, 2, 3) so sorting and per-floor rollups never
                                            // have to parse the letter back out of the text.
                                            // Because the suffix is inside Home_number, CLAUDE.md §9's uniqueness rule stays a
                                            // single indexed Text equality per plant - still delegable, just now per floor.
                                            Set(varBaseHome, Trim(txt_home_number.Text));
                                            Set(varFloorCount, Coalesce(num_floors.Value, 0));

                                            // Build the floor rows BEFORE validating, so the duplicate check and the write both
                                            // test exactly the same generated names - they can never disagree.
                                            ClearCollect(col_new_floors,
                                                ForAll(Sequence(Max(varFloorCount, 1)) As S,
                                                    {
                                                        fnum: S.Value,
                                                        hname: varBaseHome &
                                                            If(varFloorCount <= 1, "", Char(64 + S.Value))
                                                    }
                                                )
                                            );

                                            // One delegable LookUp per generated name (Plant_ID leads, Home_number indexed).
                                            // Checks every floor, not just the first - adding 2 floors when "...A" already
                                            // exists but "...B" does not must still be blocked as a whole.
                                            Set(varDupFloors,
                                                Concat(
                                                    Filter(col_new_floors,
                                                        !IsBlank(LookUp(qk_home, Plant_ID = varPID && Home_number = hname))),
                                                    hname, ", "));

                                            If( IsBlank(varBaseHome),
                                                Notify("Enter a home production number.", NotificationType.Error),

                                                varFloorCount < 1,
                                                Notify("Enter how many floors this home has.", NotificationType.Error),

                                                // The suffix scheme is A-Z, so 26 floors is the hard ceiling.
                                                varFloorCount > 26,
                                                Notify("A home cannot have more than 26 floors.", NotificationType.Error),

                                                !IsBlank(varDupFloors),
                                                Notify("Already recorded for this plant: " & varDupFloors & ".",
                                                       NotificationType.Error),

                                                // Batched two-table Patch, same shape the defect reconcile already uses -
                                                // one call for the whole home rather than a Patch per floor.
                                                IfError(
                                                    Patch(qk_home,
                                                        ForAll(col_new_floors As F, Defaults(qk_home)),
                                                        ForAll(col_new_floors As F, {
                                                            Title:        varPID & "." & varFacility & "." & F.hname,
                                                            Plant_ID:     varPID,
                                                            Facility_ID:  varFacility,
                                                            Week_key:     varWeekKey,
                                                            Week_start:   varWeekStart,
                                                            Week_end:     varWeekEnd,
                                                            Home_number:  F.hname,
                                                            Floor_number: F.fnum,
                                                            // Floors stays the home's total floor count, repeated on each floor row -
                                                            // it is what tells the gallery "floor 2 of 3" without a second query.
                                                            Floors:       varFloorCount,
                                                            Fiscal_year:  varFiscalYear,
                                                            Fiscal_quarter: varFiscalQuarter,
                                                            Week_number:  varWeekNumber,
                                                            Entered_at:   Now(),
                                                            Entered_by:   varUserEmail
                                                        })
                                                    ),
                                                    Notify("Could not save floors. " & FirstError.Message, NotificationType.Error)
                                                );
                                                Notify(If(varFloorCount = 1,
                                                          "Added " & varBaseHome & ".",
                                                          "Added " & varFloorCount & " floors: " &
                                                              Concat(col_new_floors, hname, ", ") & "."),
                                                       NotificationType.Success);
                                                Reset(txt_home_number);
                                                Reset(num_floors);
                                                // Reload the week FIRST so col_homes contains the floors just added, then rebuild -
                                                // btn_rebuild_rollups computes every rollup figure from col_homes (CLAUDE.md §8.6).
                                                Select(btn_load_week);
                                                Select(btn_rebuild_rollups)
                                            )
                                          Text: ="+ Add"
                              - lbl_progress:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =TextSecondary
                                    Height: =18
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      ="Floors entered " & CountRows(col_homes) & " . Fully tested " &
                                      CountRows(Filter(col_homes, !IsBlank(Elec_result) && !IsBlank(Plumb_result) && !IsBlank(Gas_result))) &
                                      " . Pending " &
                                      CountRows(Filter(col_homes, IsBlank(Elec_result) || IsBlank(Plumb_result) || IsBlank(Gas_result)))
                                    Wrap: =false
                              - progress_homes:
                                  Control: Progress
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =6
                                    Max: =Max(1, CountRows(col_homes))
                                    ProgressColor: ='Progress.ProgressColor'.Brand
                                    Value: =CountRows(Filter(col_homes, !IsBlank(Elec_result) && !IsBlank(Plumb_result) && !IsBlank(Gas_result)))
                              - gal_week_homes:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Floors tested this week"
                                    Items: =Sort(col_homes, Created, SortOrder.Descending)
                                    LayoutMinWidth: =0
                                    ShowNavigation: =true
                                    ShowScrollbar: =false
                                    TabIndex: =0
                                    TemplateSize: =56
                                  Children:
                                    - cnt_home_row_wrap:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          Height: =56
                                          Width: =Parent.Width-Parent.X
                                        Children:
                                          - cnt_home_row:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =GridLine
                                                BorderThickness: =1
                                                Fill: =If(varHomeNumberNum=ThisItem.Home_number && varHomeOpen,RGBA(156,212,234,1),RGBA(0, 0, 0, 0))
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =6
                                                LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                                Width: =Parent.Width
                                              Children:
                                                - lbl_row_home:
                                                    Control: ModernText
                                                    Properties:
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Center
                                                      FontWeight: =FontWeight.Semibold
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =13
                                                      Text: =Text(ThisItem.Home_number, "0")
                                                      Width: =100
                                                      Wrap: =false
                                                - badge_row_elec:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: ="Electrical result"
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: ='BadgeCanvas.Appearance'.Filled
                                                      BasePaletteColor: |-
                                                        =With({r: ThisItem.Elec_result},
                                                            StatusColorOf(If(r=1,"good",r=0,"critical","nodata")))
                                                      Content: |-
                                                        =With({r: ThisItem.Elec_result},
                                                            "E " & StatusGlyphOf(If(r=1,"good",r=0,"critical","nodata")) &     " " & If(r=1,"Pass",r=0,"Fail","-"))
                                                      FontColor: =RGBA(255,255,255,1)
                                                      Height: =20
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      Width: =70
                                                - badge_row_plumb:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: ="Plumbing result"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: ='BadgeCanvas.Appearance'.Filled
                                                      BasePaletteColor: |-
                                                        =With({r: ThisItem.Plumb_result},
                                                            StatusColorOf(If(r=1,"good",r=0,"critical","nodata")))
                                                      Content: |-
                                                        =With({r: ThisItem.Plumb_result},
                                                            "P " & StatusGlyphOf(If(r=1,"good",r=0,"critical","nodata")) &
                                                            " " & If(r=1,"Pass",r=0,"Fail","-"))
                                                      FontColor: =RGBA(255,255,255,1)
                                                      Height: =20
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      Width: =70
                                                - badge_row_gas:
                                                    Control: Badge
                                                    Properties:
                                                      AccessibleLabel: ="Gas result"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: ='BadgeCanvas.Appearance'.Filled
                                                      BasePaletteColor: |-
                                                        =With({r: ThisItem.Gas_result},
                                                            StatusColorOf(If(r=1,"good",r=0,"critical","nodata")))
                                                      Content: |-
                                                        =With({r: ThisItem.Gas_result},
                                                            "G " & StatusGlyphOf(If(r=1,"good",r=0,"critical","nodata")) &
                                                            " " & If(r=1,"Pass",r=0,"Fail","-"))
                                                      FontColor: =RGBA(255,255,255,1)
                                                      Height: =20
                                                      Shape: ='BadgeCanvas.Shape'.Rounded
                                                      Width: =70
                                                - lbl_row_defects:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =TextMuted
                                                      FillPortions: =1
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: |-
                                                        =Coalesce(
                                                            Sum(Filter(col_week_defects, Home_number = Text(ThisItem.Home_number, "0")), Coalesce(Qty, 1)),
                                                            0) &
                                                        " defects"
                                                      Wrap: =false
                                          - btn_row_overlay:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Open home"
                                                Appearance: =ButtonAppearance.Transparent
                                                BorderThickness: =0
                                                Height: =Parent.Height
                                                OnSelect: |-
                                                  =Set(varHomeNumberNum, ThisItem.Home_number);
                                                  Set(varHomeNumberText, Text(ThisItem.Home_number, "0"));
                                                  Set(varFloorNumber, ThisItem.Floor_number);
                                                  Set(varFloorsOnHome, ThisItem.Floors);
                                                  Set(varElecResult, ThisItem.Elec_result);
                                                  Set(varPlumbResult, ThisItem.Plumb_result);
                                                  Set(varGasResult, ThisItem.Gas_result);
                                                  Set(varHomeEditable, varCanEdit);
                                                  ClearCollect(col_home_defects,
                                                      Filter(qk_home_defect, Plant_ID = varPID && Home_number = Text(ThisItem.Home_number, "0")));
                                                  ClearCollect(col_defect_edit, col_home_defects);
                                                  Set(varHomeOpen, true)
                                                Text: =""
                                                Width: |-
                                                  =// Stops short of the Edit/Delete buttons - this used to span the full row
                                                  // and would otherwise swallow their taps.
                                                  Parent.Width - 104
                                          - btn_row_delete:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Delete this floor"
                                                Appearance: =ButtonAppearance.Subtle
                                                BasePaletteColor: =AlertRed
                                                DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                                                Height: =40
                                                Icon: ="Delete"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =Set(varFDHome, Text(ThisItem.Home_number, "0"));
                                                  // Count what goes with it, so the confirm can say so rather than just
                                                  // asking 'are you sure'.
                                                  Set(varFDDefects,
