                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =GasColor
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =Parent.Height
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: ="Gas"
                                                Wrap: =false
                                          - btn_gas_pass:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =If(varGasResult=1, ButtonAppearance.Primary, ButtonAppearance.Outline)
                                                BasePaletteColor: =StatusGoodColor
                                                DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.Disabled)
                                                OnSelect: =Set(varGasResult, 1)
                                                Text: ="Pass"
                                                Width: =70
                                          - btn_gas_fail:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =If(varGasResult=0, ButtonAppearance.Primary, ButtonAppearance.Outline)
                                                BasePaletteColor: =StatusCriticalColor
                                                DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.Disabled)
                                                OnSelect: =Set(varGasResult, 0)
                                                Text: ="Fail"
                                                Width: =70
                                    - gal_gas_defects:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          FillPortions: =0
                                          Height: =CountRows(Filter(col_defect_edit, Test_ID = 3)) * 40
                                          Items: =Filter(col_defect_edit, Test_ID = 3)
                                          ShowScrollbar: =false
                                          TemplateSize: =40
                                          Visible: =varGasResult = 0
                                        Children:
                                          - row_gas_defect:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =36
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =4
                                                Width: =Parent.Width
                                              Children:
                                                - drp_gas_type:
                                                    Control: ModernDropdown
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Default: =LookUp(col_type, Value(Title) = ThisItem.Type_ID)
                                                      DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      FillPortions: =4
                                                      ItemDisplayText: =ThisItem.Type_name & " . " & ThisItem.QP_ref
                                                      Items: =Sort(Filter(col_type, Test_ID = 3), Sort_order)
                                                      LayoutMinWidth: =0
                                                      OnChange: |-
                                                        =Patch(col_defect_edit, ThisItem,
                                                            {Type_ID: Value(drp_gas_type.Selected.Title), Defect_ID: Blank(), Severity: Blank(),
                                                             Defect_cost: Blank()})
                                                - drp_gas_defect:
                                                    Control: ModernDropdown
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Default: =LookUp(col_defect, Value(Title) = ThisItem.Defect_ID)
                                                      DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      FillPortions: =7
                                                      ItemDisplayText: =ThisItem.Defect_name
                                                      Items: =Sort(Filter(col_defect, Type_ID = Value(drp_gas_type.Selected.Title)), Sort_order)
                                                      LayoutMinWidth: =0
                                                      OnChange: |-
                                                        =Patch(col_defect_edit, ThisItem,
                                                            {Defect_ID: Value(drp_gas_defect.Selected.Title), Severity: drp_gas_defect.Selected.Severity,
                                                             Defect_cost: drp_gas_defect.Selected.Defect_cost})
                                                - num_gas_qty:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AccessibleLabel: ="Gas defect quantity"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Default: =ThisItem.Qty
                                                      DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.View)
                                                      Min: =1
                                                      OnChange: |-
                                                        =Patch(col_defect_edit, ThisItem, {Qty: Coalesce(num_gas_qty.Value, 1)})
                                                      Width: =60
                                                - btn_gas_remove:
                                                    Control: ModernButton
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Subtle
                                                      DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.Disabled)
                                                      Icon: ="Delete"
                                                      Layout: =ButtonLayout.IconOnly
                                                      OnSelect: =Remove(col_defect_edit, ThisItem)
                                                      Width: =32
                                    - btn_gas_add:
                                        Control: ModernButton
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Subtle
                                          DisplayMode: =If(varHomeEditable, DisplayMode.Edit, DisplayMode.Disabled)
                                          OnSelect: |-
                                            =With(
                                                {availDefect: First(Filter(col_defect, Test_ID = 3 &&
                                                    !(Value(Title) in col_defect_edit.Defect_ID)))},
                                                If(IsBlank(availDefect),
                                                    Notify("All Gas defects are already recorded on this home.", NotificationType.Warning),
                                                    Collect(col_defect_edit, {
                                                        Test_ID: 3,
                                                        Type_ID: availDefect.Type_ID,
                                                        Defect_ID: Value(availDefect.Title),
                                                        Qty: 1,
                                                        Severity: availDefect.Severity,
                                                        Defect_cost: availDefect.Defect_cost
                                                    })
                                                )
                                            )
                                          Text: ="+ Add defect"
                                          Visible: =varGasResult = 0
                                    - lbl_gas_warning:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =StatusWarningColor
                                          Height: =28
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="No defects recorded for this fail - will be flagged incomplete."
                                          Visible: =varGasResult = 0 && CountRows(Filter(col_defect_edit, Test_ID = 3)) = 0
                  - btn_rebuild_rollups:
                      Control: Button
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        Height: =1
                        OnSelect: |-
                          =// col_homes is now one row PER FLOOR, so every count below is a floor count.
                          // varFloors        - floors entered for the facility-week (tested or not)
                          // varFloorsTested  - floors with ALL THREE results present. This is the FTT
                          //                    denominator and the fix for the old bug: the previous code
                          //                    divided by every row entered, so a floor added but not yet
                          //                    tested counted as a failure and FTT read low all week,
                          //                    self-correcting only once the last floor was tested.
                          // varFloorsClean   - floors that passed all three first time (the FTT numerator).
                          // A partially tested floor is now in NEITHER - it cannot be clean, and it is no
                          // longer forced into the denominator.
                          Set(varFloors, CountRows(col_homes));
                          Set(varFloorsTested,
                              CountRows(Filter(col_homes,
                                  !IsBlank(Elec_result) && !IsBlank(Plumb_result) && !IsBlank(Gas_result))));
                          Set(varFloorsClean,
                              CountRows(Filter(col_homes,
                                  Elec_result = 1 && Plumb_result = 1 && Gas_result = 1)));
                          // Distinct production numbers behind those floors, for Homes_tested/Defects_per_home.
                          // Home_number carries the floor suffix, so a multi-floor home is several rows sharing
                          // a base - count distinct bases by stripping the suffix off suffixed rows.
                          Set(varHomes,
                              CountRows(Distinct(col_homes,
                                  If(Floors <= 1, Home_number, Left(Home_number, Len(Home_number) - 1)))));
                          Set(varPass, Sum(col_homes, Coalesce(Elec_result,0) + Coalesce(Plumb_result,0) + Coalesce(Gas_result,0)));
                          Set(varTests, Sum(col_homes, If(IsBlank(Elec_result),0,1) + If(IsBlank(Plumb_result),0,1) + If(IsBlank(Gas_result),0,1)));
                          // One row = one floor, so the week's floor total is the row count, not a Sum of
                          // the per-home Floors column (which would multiply each home by its own count).
                          Set(varTotalFloors, varFloors);
                          ClearCollect(col_week_defects,
                              Filter(qk_home_defect, Plant_ID = varPID && Week_key = varWeekKey && Facility_ID = varFacility));
                          Set(varTotalDefects, Sum(col_week_defects, Coalesce(Qty, 1)));
                          // Cost of poor quality for the facility-week. Extended = Qty * unit cost,
                          // read from the stamp on each qk_home_defect row so it matches what the
                          // by-test chart computes. Falls back to the live taxonomy only for rows
                          // written before the stamp existed.
                          Set(varTotalCost,
                              Sum(col_week_defects,
                                  Coalesce(Qty, 1) *
                                      Coalesce(Defect_cost,
                                          LookUp(col_defect_all, Value(Title) = Defect_ID, Defect_cost),
                                          0)));
                          IfError(
                              // Base record MUST be Coalesce(LookUp(...), Defaults(...)) - never the four-argument
                              // Patch(src, LookUp(...), Defaults(...), {fields}) form that was here. That overload
                              // merges Defaults and the field record onto whatever LookUp returned, and on the FIRST
                              // save of a facility-week LookUp returns Blank(): Patch cannot create a row from a blank
                              // base, so no rollup row was written at all. Because the dashboard reads qk_week_summary
                              // / qk_test_summary and never qk_home*, that newest week then stayed invisible on every
                              // dashboard read while already-existing weeks kept updating normally. The defect
                              // reconcile above already used the Coalesce form - these four did not.
                              Patch(qk_week_summary,
                                  Coalesce(
                                      LookUp(qk_week_summary, Plant_ID = varPID && Facility_ID = varFacility && Week_key = varWeekKey),
                                      Defaults(qk_week_summary)
                                  ),
                                  {
                                      Title: varPID & "." & varFacility & "." & Text(varWeekKey, "0"),
                                      Plant_ID: varPID, Facility_ID: varFacility, Week_key: varWeekKey,
                                      Week_start: varWeekStart, Week_end: varWeekEnd,
                                      Homes_tested: varHomes,
                                      Homes_clean: varFloorsClean,
                                      Floors_tested: varFloorsTested,
                                      Floors_clean: varFloorsClean,
                                      // FTT is now floors-through, not homes-through (CLAUDE.md §7 updated):
                                      // floors passing all three / floors fully tested.
                                      FTT_pct: If(varFloorsTested > 0,
                                          Round(varFloorsClean / varFloorsTested * 100, 1), Blank()),
                                      Total_tests: varTests, Total_pass: varPass, Total_fail: varTests - varPass,
                                      Week_FPY: If(varTests > 0, Round(varPass / varTests * 100, 1), Blank()),
                                      Total_floors: varTotalFloors, Total_defects: varTotalDefects,
                                      Total_cost: varTotalCost,
                                      Defects_per_floor: If(varFloorsTested > 0, Round(varTotalDefects / varFloorsTested, 1), 0),
                                      Defects_per_home: If(varHomes > 0, Round(varTotalDefects / varHomes, 1), 0),
                                      Fiscal_year: varFiscalYear,
                                      Fiscal_quarter: varFiscalQuarter,
                                      Week_number: varWeekNumber
                                  }
                              ),
                              Notify("Could not update the week summary. " & FirstError.Message, NotificationType.Error)
                          );
                          Set(varElecHomes, CountRows(Filter(col_homes, !IsBlank(Elec_result))));
                          Set(varElecPass, CountRows(Filter(col_homes, Elec_result = 1)));
                          Set(varPlumbHomes, CountRows(Filter(col_homes, !IsBlank(Plumb_result))));
                          Set(varPlumbPass, CountRows(Filter(col_homes, Plumb_result = 1)));
                          Set(varGasHomes, CountRows(Filter(col_homes, !IsBlank(Gas_result))));
                          Set(varGasPass, CountRows(Filter(col_homes, Gas_result = 1)));
                          IfError(
                              Patch(qk_test_summary,
                                  Coalesce(
                                      LookUp(qk_test_summary, Plant_ID = varPID && Facility_ID = varFacility && Week_key = varWeekKey && Test_ID = 1),
                                      Defaults(qk_test_summary)
                                  ),
                                  {
                                      Title: varPID & "." & varFacility & "." & Text(varWeekKey, "0") & ".1",
                                      Plant_ID: varPID, Facility_ID: varFacility, Week_key: varWeekKey, Test_ID: 1,
                                      Homes_tested: varElecHomes, Pass: varElecPass, Fail: varElecHomes - varElecPass,
                                      Test_FPY: If(varElecHomes > 0, Round(varElecPass / varElecHomes * 100, 1), Blank())
                                  }
                              ),
                              Notify("Could not update Electrical test summary. " & FirstError.Message, NotificationType.Error)
                          );
                          IfError(
                              Patch(qk_test_summary,
                                  Coalesce(
                                      LookUp(qk_test_summary, Plant_ID = varPID && Facility_ID = varFacility && Week_key = varWeekKey && Test_ID = 2),
                                      Defaults(qk_test_summary)
                                  ),
                                  {
                                      Title: varPID & "." & varFacility & "." & Text(varWeekKey, "0") & ".2",
                                      Plant_ID: varPID, Facility_ID: varFacility, Week_key: varWeekKey, Test_ID: 2,
                                      Homes_tested: varPlumbHomes, Pass: varPlumbPass, Fail: varPlumbHomes - varPlumbPass,
                                      Test_FPY: If(varPlumbHomes > 0, Round(varPlumbPass / varPlumbHomes * 100, 1), Blank())
                                  }
                              ),
                              Notify("Could not update Plumbing test summary. " & FirstError.Message, NotificationType.Error)
                          );
                          IfError(
                              Patch(qk_test_summary,
                                  Coalesce(
                                      LookUp(qk_test_summary, Plant_ID = varPID && Facility_ID = varFacility && Week_key = varWeekKey && Test_ID = 3),
                                      Defaults(qk_test_summary)
                                  ),
                                  {
                                      Title: varPID & "." & varFacility & "." & Text(varWeekKey, "0") & ".3",
                                      Plant_ID: varPID, Facility_ID: varFacility, Week_key: varWeekKey, Test_ID: 3,
                                      Homes_tested: varGasHomes, Pass: varGasPass, Fail: varGasHomes - varGasPass,
                                      Test_FPY: If(varGasHomes > 0, Round(varGasPass / varGasHomes * 100, 1), Blank())
                                  }
                              ),
                              Notify("Could not update Gas test summary. " & FirstError.Message, NotificationType.Error)
                          );
                          // ===== Plant rollup (qk_plant_summary) - the tier above qk_week_summary =====
                          // Runs AFTER the week/test patches above so the query below picks up the row we just
                          // wrote. col_week cannot be reused here: RunFullPlantLoad() has not run yet at this
                          // point, so it is still holding the pre-save snapshot.
                          //
                          // This exists because scr_CorporateHome previously read qk_week_summary unbounded
                          // across every plant - one row per plant x facility x week, ~720 rows for 40 plants,
                          // which silently truncated at the app's data row limit and corrupted EVERY plant's
                          // number at once. One row per plant collapses that to ~40 rows.
                          //
                          // Plant-wide on purpose: NO facility filter. Corporate consolidates to plants.
                          Set(varPSCutoffKey, Value(Text(DateAdd(varWeekEnd, -84, TimeUnit.Days), "yyyymmdd")));
                          ClearCollect(col_plant_window,
                              Filter(qk_week_summary, Plant_ID = varPID && Week_key >= varPSCutoffKey));

                          // Exactly 12 distinct weeks - the date cutoff alone can straddle 13 week-endings
                          // depending on what day of the week it is.
                          Set(varPSWeeks,
                              FirstN(Sort(Distinct(col_plant_window, Week_key), Value, SortOrder.Descending), 12));
                          Set(varPSStartKey, Min(varPSWeeks, Value));
                          Set(varPSEndKey,   Max(varPSWeeks, Value));
                          ClearCollect(col_plant_12, Filter(col_plant_window, Week_key >= varPSStartKey));

                          // Store the COMPONENTS, not just the percentages. Regions roll up as
                          // Sum(pass)/Sum(tests) across plants - weighted, never a mean of plant percentages,
                          // which would let a 4-floor plant swing the region as hard as a 400-floor one
                          // (CLAUDE.md §7, §8.0).
                          Set(varPSTests,   Sum(col_plant_12, Total_tests));
                          Set(varPSPass,    Sum(col_plant_12, Total_pass));
                          Set(varPSFloorsT, Sum(col_plant_12, Floors_tested));
                          Set(varPSFloorsC, Sum(col_plant_12, Floors_clean));
                          Set(varPSHomes,   Sum(col_plant_12, Homes_tested));
                          Set(varPSDefects, Sum(col_plant_12, Total_defects));
                          Set(varPSCost,    Sum(col_plant_12, Total_cost));

                          // Latest week only, for scr_CorporateHome. The 12-week aggregate above is what
                          // FTT_pct holds, and it smooths exactly the signal a corporate QM needs to see: a
                          // plant that cratered last week but had eleven good ones still reads fine. This is
                          // the same number that plant's own dashboard tile shows.
                          //
                          // Still WEIGHTED across the plant's facilities (Sum clean / Sum tested) rather than
                          // picking one facility's row - varPSEndKey can match several rows for a multi-
                          // facility plant. Reuses col_plant_12, so it costs no extra query.
                          Set(varPSLatestRows, Filter(col_plant_12, Week_key = varPSEndKey));
                          Set(varPSLatestFloorsT, Sum(varPSLatestRows, Floors_tested));
                          Set(varPSLatestFloorsC, Sum(varPSLatestRows, Floors_clean));

                          // Last COMPLETED calendar week (PastWeekKey, App.Formulas), for the
                          // Floors_*_lastwk quick-reference stamps below. Distinct from
                          // varPSLatestRows above: "latest" is the newest REPORTED week (can be
                          // the in-progress one; feeds FTT_latest_pct), while "lastwk" is pinned
                          // to the calendar so it never shows a partial week - the same week the
                          // scr_CorporateHome region badge scores. Weighted across facilities,
                          // read from col_plant_window (not col_plant_12) so it resolves even
                          // when a back-fill edit shifts the 12-week window.
                          Set(varPSPastRows, Filter(col_plant_window, Week_key = PastWeekKey));
                          Set(varPSPastFloorsT, Sum(varPSPastRows, Floors_tested));
                          Set(varPSPastFloorsC, Sum(varPSPastRows, Floors_clean));

                          IfError(
                              Patch(qk_plant_summary,
                                  Coalesce(
                                      LookUp(qk_plant_summary, Plant_ID = varPID),
                                      Defaults(qk_plant_summary)
                                  ),
                                  {
                                      Title:        Text(varPID, "0"),
                                      Plant_ID:     varPID,
                                      // Region written deliberately per plant, rather than corporate picking
                                      // whichever facility row happened to sort first out of Plant_List.
                                      Plant_name:   LookUp(col_plants, Plant_ID = varPID, Plant_Names),
                                      Plant_Region: LookUp(col_plants, Plant_ID = varPID, Plant_Region),
                                      Total_tests:   varPSTests,
                                      Total_pass:    varPSPass,
                                      Floors_tested: varPSFloorsT,
                                      Floors_clean:  varPSFloorsC,
                                      // Quick-reference stamps: the last completed week's floor
                                      // counts, so the list row itself answers "how many floors
                                      // did this plant test last week" - this row's Floors_tested
                                      // / Floors_clean above are 12-WEEK totals and have been
                                      // misread as weekly numbers more than once. Corporate's
                                      // region badge still computes from qk_week_summary live;
                                      // these stamps are reference, not a consumer feed.
                                      Floors_tested_lastwk: varPSPastFloorsT,
                                      Floors_clean_lastwk:  varPSPastFloorsC,
                                      Homes_tested:  varPSHomes,
                                      Total_defects: varPSDefects,
                                      Total_cost:    varPSCost,
                                      // TTW_FPY (composite test-weighted trailing-12 FPY) is retained for
                                      // compatibility only and is NOT displayed anywhere. TTW in the UI is
                                      // FTT_pct below - the weighted trailing-12-week First Time Pass Rate,
                                      // floor basis (dashboard TTW tile, corporate plant/region TTW).
                                      TTW_FPY: If(varPSTests > 0,
                                          Round(varPSPass / varPSTests * 100, 1), Blank()),
                                      FTT_pct: If(varPSFloorsT > 0,
                                          Round(varPSFloorsC / varPSFloorsT * 100, 1), Blank()),
                                      // A trailing window moves with the calendar, not with data entry - a plant
                                      // that stops reporting keeps a figure computed over a window that has since
                                      // slid. These three make that visible instead of silently wrong.
                                      FTT_latest_pct: If(varPSLatestFloorsT > 0,
                                          Round(varPSLatestFloorsC / varPSLatestFloorsT * 100, 1),
                                          Blank()),
                                      Latest_week_key: varPSEndKey,
                                      Window_start_key: varPSStartKey,
                                      Window_end_key:   varPSEndKey,
                                      Weeks_counted:    CountRows(varPSWeeks),
                                      Updated_at:       Now(),
                                      Updated_by:       varUserEmail
                                  }
                              ),
                              Notify("Could not update the plant summary. " & FirstError.Message,
                                  NotificationType.Error)
                          );
                          RunFullPlantLoad();
                          Select(btn_load_week);
                          // Drop the saving overlay raised by btn_save_home. Every rollup write
                          // above has completed by this line - the queued btn_load_week that
                          // follows is only the local week-view refresh. Harmless no-op for the
                          // other rebuild callers (add home, floor edit/delete), which never
                          // raise the flag.
                          Set(varSaving, false)
                        Text: =""
                        Visible: =false
                        Width: =1
      - cnt_floor_edit_overlay:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            Visible: =varShowFloorEdit
            Width: =Parent.Width
          Children:
            - rect_fe_scrim:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(11, 11, 11, 0.55)
                  Height: =Parent.Height
                  Width: =Parent.Width
            - btn_fe_scrim_cancel:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BorderThickness: =0
                  Height: =Parent.Height
                  OnSelect: =Set(varShowFloorEdit, false)
                  Text: =""
                  Width: =Parent.Width
            - cnt_fe_card:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  Fill: =CardBg
                  Height: =260
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Min(Parent.Width - 64, 420)
                  X: =(Parent.Width - Self.Width)/2
                  Y: =(Parent.Height - Self.Height)/2
                Children:
                  - lbl_fe_title:
                      Control: ModernText
                      Properties:
                        Color: =TextPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Edit floor number"
                        Width: =Parent.Width - 48
                        Wrap: =false
                        X: =24
                        Y: =20
                  - lbl_fe_sub:
                      Control: ModernText
                      Properties:
                        Color: =TextSecondary
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =varFEHome & " - " &
                          If(varFEFloors = 1, "single floor home",
                             "floor " & Text(varFEFloor, "0") & " of " & Text(varFEFloors, "0"))
                        Width: =Parent.Width - 48
                        Wrap: =false
                        X: =24
                        Y: =50
                  - lbl_fe_preview:
                      Control: ModernText
                      Properties:
                        Color: =TextSecondary
                        Height: =44
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =// The trailing letter IS the floor indicator, so the stored ordinal is read
                          // back off it instead of being typed separately - the two can never disagree.
                          // No suffix means floor 1. CLAUDE.md §9 forbids validating a production
                          // number's format, so any other coding a plant uses is left untouched.
                          If(IsBlank(Trim(txt_fe_floor_id.Text)), "",
                              "Stored as floor " &
                              Text(Coalesce(Find(Upper(Right(Trim(txt_fe_floor_id.Text), 1)),
                                  "ABCDEFGHIJKLMNOPQRSTUVWXYZ"), 1), "0"))
                        Width: =Parent.Width - 228
                        X: =214
                        Y: =84
                  - lbl_fe_note:
                      Control: ModernText
                      Properties:
                        Color: =TextMuted
                        Height: =34
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="Any defects already recorded on this floor will be kept."
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =136
                  - btn_fe_cancel:
                      Control: ModernButton
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =44
                        OnSelect: =Set(varShowFloorEdit, false)
                        Text: ="Cancel"
                        Width: =100
                        X: =115
                        Y: =195
                  - btn_fe_save:
                      Control: ModernButton
                      Properties:
                        BasePaletteColor: =ChampionBlue
                        Height: =44
                        OnSelect: |-
                          =// The user edits the FULL floor number, suffix included - it is the identifier, not
                          // an ordinal picked from a spinner. Floor_number is derived from the trailing letter
                          // so the two views of the same fact are always written together.
                          Set(varFENew, Trim(txt_fe_floor_id.Text));
                          Set(varFENewFloor,
                              Coalesce(Find(Upper(Right(varFENew, 1)),
                                  "ABCDEFGHIJKLMNOPQRSTUVWXYZ"), 1));

                          If( IsBlank(varFENew),
                              Notify("Enter a floor number.", NotificationType.Error),

                              // Renaming onto a floor that already exists would create a duplicate production
                              // number for the plant (CLAUDE.md §9). No format rule beyond that - plants use
                              // their own coding, so anything unique is allowed.
                              varFENew <> varFEHome &&
                                  !IsBlank(LookUp(qk_home, Plant_ID = varPID && Home_number = varFENew)),
                              Notify(varFENew & " already exists for this plant.", NotificationType.Error),

                              // qk_home_defect rows are keyed by Home_number, so they are renamed in the same
                              // action or every defect on this floor orphans.
                              ClearCollect(col_fe_defects,
                                  Filter(qk_home_defect, Plant_ID = varPID && Home_number = varFEHome));

                              IfError(
                                  Patch(qk_home,
                                      LookUp(qk_home, Plant_ID = varPID && Home_number = varFEHome),
                                      {
                                          Home_number:  varFENew,
                                          Floor_number: varFENewFloor,
                                          Title: varPID & "." & varFacility & "." & varFENew
                                      }),
                                  Notify("Could not update the floor. " & FirstError.Message,
                                      NotificationType.Error)
                              );

                              IfError(
                                  Patch(qk_home_defect,
                                      col_fe_defects,
                                      ForAll(col_fe_defects As D, {
                                          Home_number:  varFENew,
                                          Floor_number: varFENewFloor,
                                          Title: varPID & "." & varFacility & "." & varFENew &
                                              "." & Text(D.Defect_ID, "0")
                                      })),
                                  Notify("Floor saved, but its defect rows could not be moved. " &
                                      FirstError.Message, NotificationType.Error)
                              );

                              Notify("Saved as " & varFENew & ".", NotificationType.Success);
                              Set(varShowFloorEdit, false);
                              Set(varHomeOpen, false);
                              Select(btn_load_week);
                              Select(btn_rebuild_rollups)
                          )
                        Text: ="Save"
                        Width: =110
                        X: =223
                        Y: =195
                  - txt_fe_floor_id:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Floor number"
                        Default: =varFEHome
                        Height: =44
                        Placeholder: ="e.g. 4471203B"
                        Type: ='TextInputType'.SingleLine
                        Width: =180
                        X: =24
                        Y: =84
      - cnt_floor_delete_overlay:
