            - btn_fd_scrim_cancel:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Transparent
                  BorderThickness: =0
                  Height: =Parent.Height
                  OnSelect: =Set(varShowFloorDelete, false)
                  Text: =""
