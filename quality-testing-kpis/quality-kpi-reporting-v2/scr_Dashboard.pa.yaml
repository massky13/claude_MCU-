                        - cnt_trend:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =!IsBlank(varPID)
                            Children:
                              - cnt_trend_chart_wrap:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    Height: =260
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                                  Children:
                                    - img_trend_db:
                                        Control: Image
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height
                                          Image: |-
                                            ="data:image/svg+xml;utf8," & EncodeUrl(
                                              // The viewBox width tracks the control's own aspect ratio, so ImagePosition.Fit
                                              // scales the drawing to fill the container edge to edge with no letterboxing and
                                              // no distortion. A fixed viewBox width could not do both: the container is far
                                              // wider than it is tall on a desktop, so a fixed-aspect drawing gets
                                              // height-constrained and leaves dead space down each side.
                                              // Because the aspect always matches, the render scale is Parent.Height/250 - a
                                              // constant - so type stays the same physical size at every screen width.
                                              With({VBW: Round(250 * Parent.Width / Max(Parent.Height, 1), 0)},
                                              With({PX0: 44,
                                                    PXR: Round(250 * Parent.Width / Max(Parent.Height, 1), 0) - 16,
                                                    SPAN: Round(250 * Parent.Width / Max(Parent.Height, 1), 0) - 60,
                                                    N: Max(CountRows(col_trend_chart) - 1, 1)},

                                              "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " & VBW & " 250'>" &
                                              "<rect x='0' y='0' width='" & VBW & "' height='250' fill='#ffffff'/>" &

                                              // --- y gridlines + labels, five steps from varTrendFloor up to 100 ---
                                              Concat([0,1,2,3,4] As g,
                                                  "<line x1='" & PX0 & "' x2='" & PXR & "' y1='" &
                                                  Text(184 - g.Value/4*172, "[$-en-US]0.0") & "' y2='" &
                                                  Text(184 - g.Value/4*172, "[$-en-US]0.0") &
                                                  "' stroke='#e1e0d9' stroke-width='1'/>" &
                                                  "<text x='37' y='" & Text(184 - g.Value/4*172 + 3.5, "[$-en-US]0.0") &
                                                  "' font-size='10' fill='#898781' text-anchor='end'>" &
                                                  Text(varTrendFloor + g.Value/4*(100-varTrendFloor), "[$-en-US]0") &
                                                  "%</text>") &

                                              // --- baseline ---
                                              "<line x1='" & PX0 & "' x2='" & PXR & "' y1='184' y2='184' stroke='#c3c2b7' stroke-width='1'/>" &

                                              // --- week-ending ticks + rotated date labels, one per week ---
                                              Concat(col_trend_chart,
                                                  "<line x1='" & Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") &
                                                  "' x2='" & Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") &
                                                  "' y1='184' y2='190' stroke='#c3c2b7' stroke-width='1'/>" &
                                                  "<text x='" & Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") &
                                                  "' y='196' font-size='10' fill='#898781' text-anchor='end' transform='rotate(-45 " &
                                                  Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") &
                                                  " 196)'>" & lbl & "</text>") &

                                              // --- goal reference rule (CLAUDE.md §8.1) ---
                                              "<line x1='" & PX0 & "' x2='" & PXR & "' y1='" &
                                                  Text(184 - (varGoalFPY-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") & "' y2='" &
                                                  Text(184 - (varGoalFPY-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") &
                                                  "' stroke='#E15242' stroke-width='1.5' stroke-dasharray='6 4'/>" &
                                              "<text x='" & PXR & "' y='" &
                                                  Text(184 - (varGoalFPY-varTrendFloor)/Max(100-varTrendFloor, 1)*172 - 5, "[$-en-US]0.0") &
                                                  "' font-size='10' font-weight='700' fill='#E15242' text-anchor='end'>GOAL " &
                                                  varGoalFPY & "%</text>" &

                                              // --- the three per-test series, fixed slot colours (CLAUDE.md §11):
                                              //     Electrical #1B6FA8, Plumbing #eb6834, Gas #1baf7a. Blank weeks are
                                              //     filtered out per series so a test that was not run never plots as 0.
                                              "<polyline points='" &
                                              Concat(Filter(col_trend_chart, !IsBlank(elec)),
                                                  Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") & "," &
                                                  Text(184 - (Max(elec, varTrendFloor)-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") & " ") &
                                              "' fill='none' stroke='#1B6FA8' stroke-width='1.8' stroke-linejoin='round' opacity='0.95'/>" &
                                              "<polyline points='" &
                                              Concat(Filter(col_trend_chart, !IsBlank(plumb)),
                                                  Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") & "," &
                                                  Text(184 - (Max(plumb, varTrendFloor)-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") & " ") &
                                              "' fill='none' stroke='#eb6834' stroke-width='1.8' stroke-linejoin='round' opacity='0.95'/>" &
                                              "<polyline points='" &
                                              Concat(Filter(col_trend_chart, !IsBlank(gas)),
                                                  Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") & "," &
                                                  Text(184 - (Max(gas, varTrendFloor)-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") & " ") &
                                              "' fill='none' stroke='#1baf7a' stroke-width='1.8' stroke-linejoin='round' opacity='0.95'/>" &

                                              // --- overall Week_FPY last, so it sits on top. Near-black and heaviest:
                                              //     the composite line must not read as a fourth test, and it cannot use
                                              //     Champion Blue without colliding with Electrical's slot colour.
                                              "<polyline points='" &
                                              Concat(Filter(col_trend_chart, !IsBlank(fpy)),
                                                  Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") & "," &
                                                  Text(184 - (Max(fpy, varTrendFloor)-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") & " ") &
                                              "' fill='none' stroke='#0b0b0b' stroke-width='2.8' stroke-linejoin='round'/>" &
                                              Concat(Filter(col_trend_chart, !IsBlank(fpy)),
                                                  "<circle cx='" & Text(PX0 + (idx-1)/N*SPAN, "[$-en-US]0.0") &
                                                  "' cy='" & Text(184 - (Max(fpy, varTrendFloor)-varTrendFloor)/Max(100-varTrendFloor, 1)*172, "[$-en-US]0.0") &
                                                  "' r='3.2' fill='#0b0b0b' stroke='#ffffff' stroke-width='1.8'/>") &

                                              // --- legend ---
                                              "<line x1='44' x2='64' y1='238' y2='238' stroke='#0b0b0b' stroke-width='2.8'/>" &
                                              "<text x='68' y='242' font-size='11' fill='#525148'>Overall</text>" &
                                              "<line x1='124' x2='144' y1='238' y2='238' stroke='#1B6FA8' stroke-width='1.8'/>" &
                                              "<text x='148' y='242' font-size='11' fill='#525148'>Electrical</text>" &
                                              "<line x1='210' x2='230' y1='238' y2='238' stroke='#eb6834' stroke-width='1.8'/>" &
                                              "<text x='234' y='242' font-size='11' fill='#525148'>Plumbing</text>" &
                                              "<line x1='298' x2='318' y1='238' y2='238' stroke='#1baf7a' stroke-width='1.8'/>" &
                                              "<text x='322' y='242' font-size='11' fill='#525148'>Gas</text>" &
                                              "<line x1='356' x2='376' y1='238' y2='238' stroke='#E15242' stroke-width='1.5' stroke-dasharray='6 4'/>" &
                                              "<text x='380' y='242' font-size='11' fill='#525148'>Goal</text>" &
                                              "</svg>"
                                              )))
                                          Width: =Parent.Width
                                    - lbl_trend_title:
                                        Control: ModernText
                                        Properties:
                                          Color: =TextPrimary
                                          FontWeight: =FontWeight.Bold
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: ="First Time Pass Rate"
                                          VerticalAlign: =VerticalAlign.Top
                                          Wrap: =false
