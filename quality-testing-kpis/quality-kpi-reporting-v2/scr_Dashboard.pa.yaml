Screens:
  scr_Dashboard:
    Properties:
      Fill: =PageBg
      OnVisible: |-
        =Reset(tabs_main_db);
        Set(varParetoLevel, Coalesce(varParetoLevel, "defect"));
        Set(varShowDrill, false);
        If(IsBlank(varPID) && varIsAdmin,
            false,
            Select(btn_refresh_dashboard)
        )
    Children:
      - cnt_root_db:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - cnt_header_db:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(2, 66, 109, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - cnt_header_left_db:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - Image2:
                            Control: Image
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =quality_logo
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Height
                        - lbl_title_db:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Bold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Quality KPI Reporting"
                              Width: =300
                              Wrap: =false
                  - cnt_header_right_db:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - ico_admin_db:
                            Control: ModernIcon
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Icon: ="Settings"
                              IconColor: =RGBA(255, 255, 255, 1)
                              OnSelect: =Navigate(scr_TaxonomyAdmin, ScreenTransition.None)
                              Tooltip: ="Admin"
                              Visible: =varIsAdmin
                        - btn_load_plant:
                            Control: Button
                            Properties:
                              Height: =1
                              OnSelect: =RunFullPlantLoad()
                              Visible: =false
                              Width: =1
                        - btn_refresh_dashboard:
                            Control: Button
                            Properties:
                              Height: =1
                              OnSelect: =RunFullPlantLoad()
                              Visible: =false
                              Width: =1
                        - btn_build_pareto:
                            Control: Button
                            Properties:
                              Height: =1
                              OnSelect: =RunFullPlantLoad()
                              Visible: =false
                              Width: =1
                        - lbl_plant_db:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Bold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: |-
                                =If(IsBlank(varPID), "Select a plant",
                                    Text(varPID) & " - " & LookUp(col_plants, Plant_ID = varPID, Plant_Names))
                              Wrap: =false
            - cnt_nav_db:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =CardBg
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  Width: =Parent.Width
                Children:
                  - tabs_main_db:
                      Control: ModernTabList
                      Properties:
                        AlignInContainer: =AlignInContainer.End
                        Default: |-
                          ={Value: "Dashboard"}
                        FillPortions: =3
                        Items: |-
                          =If(varIsAdmin,
                              If(!IsBlank(varAccessRow) && varAccessRow.Plant_ID = 0,
                                  Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"}),
                                  Table({Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"})
                              ),
                              If(!IsBlank(varAccessRow) && varAccessRow.Plant_ID = 0,
                                  Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}),
                                  Table({Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"})
                              )
                          )
                        LayoutMinHeight: =38
                        OnChange: |-
                          =If(tabs_main_db.Selected.Value = "Corporate Home", Navigate(scr_CorporateHome, ScreenTransition.None),
                              tabs_main_db.Selected.Value = "Dashboard", Navigate(scr_Dashboard, ScreenTransition.None),
                              tabs_main_db.Selected.Value = "Data Entry", Navigate(scr_Entry, ScreenTransition.None),
                              tabs_main_db.Selected.Value = "Week Detail", Navigate(scr_WeekDetail, ScreenTransition.None),
                              tabs_main_db.Selected.Value = "History", Navigate(scr_History, ScreenTransition.None),
                              tabs_main_db.Selected.Value = "Taxonomy", Navigate(scr_TaxonomyAdmin, ScreenTransition.None),
                              tabs_main_db.Selected.Value = "Access", Navigate(scr_AccessAdmin, ScreenTransition.None))
                  - cnt_filters_db:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        X: =40
                        Y: =40
                      Children:
                        - drp_plant:
                            Control: ModernDropdown
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              ItemDisplayText: =ThisItem.Plant_Label
                              Items: |-
                                =AddColumns(col_plant_picker As PP, Plant_Label,
                                    LookUp(col_plants, Plant_ID = PP.Plant_ID_Value, Plant_Names))
                              OnChange: |-
                                =Set(varPID, drp_plant.Selected.Plant_ID_Value);
                                Set(varFacility, 1);
                                Select(btn_load_plant)
                              Visible: =varIsAdmin
                              Width: =200
                        - lbl_loaded_1:
                            Control: ModernText
                            Properties:
                              Align: =Align.Right
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =TextMuted
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="Facility:"
                              Width: =130
                              Wrap: =false
                        - drp_facility:
                            Control: ModernDropdown
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Default: =LookUp(col_plants, Plant_ID = varPID && Value(Facility) = 1)
                              ItemDisplayText: =ThisItem.Facility
                              Items: =Sort(Filter(col_plants, Plant_ID = varPID), Value(Facility))
                              OnChange: |-
                                =Set(varFacility, Value(drp_facility.Selected.Facility));
                                Select(btn_load_plant)
                              Width: =60
                        - lbl_loaded:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =TextMuted
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: =If(IsBlank(varLoadedAt), "Not loaded", "Loaded " & Text(varLoadedAt, "h:mm AM/PM"))
                              Width: =130
                              Wrap: =false
                        - ico_refresh:
                            Control: ModernIcon
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Icon: ="ArrowClockwise"
                              IconColor: =ChampionBlue
                              OnSelect: =Select(btn_load_plant)
                              Tooltip: ="Refresh"
            - cnt_main_db:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =PageBg
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Width: =Parent.Width
                Children:
                  - lbl_empty_state:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =TextMuted
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Select a plant above to load its dashboard."
                        Visible: =IsBlank(varPID)
                        Width: =Parent.Width
                        Wrap: =false
                  - cnt_tiles:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: '=1   '
                        Height: =80
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        Visible: =!IsBlank(varPID)
                        Width: =Parent.Width
                      Children:
                        - tile_fpy:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Fill: =CardBg
                              Height: =Parent.Height-4
                              LayoutMinHeight: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =false
                              Width: =220
                            Children:
                              - rect_fpy_accent:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =StatusColorOf(BandStatusOf(varLatestWeek.Week_FPY))
                                    Height: =Parent.Height
                                    Width: =3
                              - btn_fpy_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varWeekKey, varLatestWeek.Week_key);
                                      Navigate(scr_WeekDetail, ScreenTransition.None)
                                    Text: =""
                                    Width: =220
                              - badge_fpy_delta:
                                  Control: Badge
                                  Properties:
                                    Content: |-
                                      =StatusGlyphOf(BandStatusOf(varLatestWeek.Week_FPY)) & " " &
                                          Text(varLatestWeek.Week_FPY - varPriorWeek.Week_FPY, "0.0")
                                    Height: '=Parent.Height*0.6   '
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: |-
                                      =If(BandStatusOf(varLatestWeek.Week_FPY) = "good", 'BadgeCanvas.ThemeColor'.Success,
                                          BandStatusOf(varLatestWeek.Week_FPY) = "warning", 'BadgeCanvas.ThemeColor'.Warning,
                                          BandStatusOf(varLatestWeek.Week_FPY) = "nodata", 'BadgeCanvas.ThemeColor'.Subtle,
                                          'BadgeCanvas.ThemeColor'.Danger)
                                    Width: =80
                                    X: =Parent.Width*1.2/2
                                    Y: =(Parent.Height-Self.Height)/2
                              - lbl_fpy_value:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextPrimary
                                    FontWeight: =FontWeight.Bold
                                    Height: =47
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(varLatestWeek.Week_FPY, "0.0") & "%"
                                    Width: =107
                                    Wrap: =false
                                    X: =20
                                    Y: =7
                              - lbl_fpy_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="FIRST TIME PASS RATE"
                                    Wrap: =false
                                    X: =20
                                    Y: =50
                        - tile_ftt:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Fill: =CardBg
                              Height: =Parent.Height-4
                              LayoutMinHeight: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =220
                            Children:
                              - rect_ftt_accent:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =StatusColorOf(BandStatusOf(varLatestWeek.FTT_pct))
                                    Height: =Parent.Height
                                    Width: =3
                              - btn_ftt_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =71
                                    OnSelect: |-
                                      =Set(varWeekKey, varLatestWeek.Week_key);
                                      Navigate(scr_WeekDetail, ScreenTransition.None)
                                    Text: =""
                                    Width: =220
                              - badge_ftt_delta:
                                  Control: Badge
                                  Properties:
                                    Content: |-
                                      =StatusGlyphOf(BandStatusOf(varLatestWeek.FTT_pct)) & " " &
                                          Text(varLatestWeek.FTT_pct - varPriorWeek.FTT_pct, "0.0")
                                    Height: =Parent.Height*0.6
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: |-
                                      =If(BandStatusOf(varLatestWeek.FTT_pct) = "good", 'BadgeCanvas.ThemeColor'.Success,
                                          BandStatusOf(varLatestWeek.FTT_pct) = "warning", 'BadgeCanvas.ThemeColor'.Warning,
                                          BandStatusOf(varLatestWeek.FTT_pct) = "nodata", 'BadgeCanvas.ThemeColor'.Subtle,
                                          'BadgeCanvas.ThemeColor'.Danger)
                                    Width: =80
                                    X: =Parent.Width*1.2/2
                                    Y: =(Parent.Height-Self.Height)/2
                              - lbl_ftt_value:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextPrimary
                                    FontWeight: =FontWeight.Bold
                                    Height: =47
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(varLatestWeek.FTT_pct, "0.0") & "%"
                                    Width: =107
                                    Wrap: =false
                                    X: =20
                                    Y: =7
                              - lbl_ftt_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="FIRST TIME PASS RATE"
                                    Wrap: =false
                                    X: =20
                                    Y: =50
                        - tile_ttw:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Fill: =CardBg
                              Height: =Parent.Height-4
                              LayoutMinHeight: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =220
                            Children:
                              - rect_ttw_accent:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =StatusColorOf(BandStatusOf(varPlantSummary.TTW_FPY))
                                    Height: =Parent.Height
                                    Width: =3
                              - btn_ttw_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =71
                                    OnSelect: |-
                                      =Set(varWeekKey, varLatestWeek.Week_key);
                                      Navigate(scr_WeekDetail, ScreenTransition.None)
                                    Text: =""
                                    Width: =220
                              - badge_ttw_delta:
                                  Control: Badge
                                  Properties:
                                    Content: |-
                                      =StatusGlyphOf(BandStatusOf(varPlantSummary.TTW_FPY)) & " " &
                                          Text(Coalesce(varPlantSummary.Weeks_counted, 0), "0") & " wks"
                                    Height: '=Parent.Height*0.6   '
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: |-
                                      =If(BandStatusOf(varPlantSummary.TTW_FPY) = "good", 'BadgeCanvas.ThemeColor'.Success,
                                          BandStatusOf(varPlantSummary.TTW_FPY) = "warning", 'BadgeCanvas.ThemeColor'.Warning,
                                          BandStatusOf(varPlantSummary.TTW_FPY) = "nodata", 'BadgeCanvas.ThemeColor'.Subtle,
                                          'BadgeCanvas.ThemeColor'.Danger)
                                    Width: =80
                                    X: =Parent.Width*1.2/2
                                    Y: =(Parent.Height-Self.Height)/2
                              - lbl_ttw_value:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextPrimary
                                    FontWeight: =FontWeight.Bold
                                    Height: =47
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(varPlantSummary.TTW_FPY, "0.0") & "%"
                                    Width: =107
                                    Wrap: =false
                                    X: =20
                                    Y: =7
                              - lbl_ttw_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="TRAILING 12 WEEKS (TTW)"
                                    Wrap: =false
                                    X: =20
                                    Y: =50
                        - tile_dph:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.Regular
                              Fill: =CardBg
                              Height: =Parent.Height-4
                              LayoutMinHeight: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =220
                            Children:
                              - rect_dph_accent:
                                  Control: Rectangle
                                  Properties:
                                    Fill: |-
                                      =If((varLatestWeek.Defects_per_home - varPriorWeek.Defects_per_home) <= 0,
                                          StatusGoodColor, StatusSeriousColor)
                                    Height: =Parent.Height
                                    Width: =3
                              - btn_dph_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =71
                                    OnSelect: |-
                                      =Set(varWeekKey, varLatestWeek.Week_key);
                                      Navigate(scr_WeekDetail, ScreenTransition.None)
                                    Text: =""
                                    Width: =220
                              - badge_dph_delta:
                                  Control: Badge
                                  Properties:
                                    Content: |-
                                      =If((varLatestWeek.Defects_per_home - varPriorWeek.Defects_per_home) <= 0, "▼ ", "▲ ") &
                                          Text(Abs(varLatestWeek.Defects_per_home - varPriorWeek.Defects_per_home), "0.0")
                                    Height: =Parent.Height*0.6
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: |-
                                      =If(IsBlank(varLatestWeek.Defects_per_home), 'BadgeCanvas.ThemeColor'.Subtle,
                                          (varLatestWeek.Defects_per_home - varPriorWeek.Defects_per_home) <= 0,
                                              'BadgeCanvas.ThemeColor'.Success,
                                          'BadgeCanvas.ThemeColor'.Danger)
                                    Width: =80
                                    X: =Parent.Width*1.2/2
                                    Y: =(Parent.Height-Self.Height)/2
                              - lbl_dph_value:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextPrimary
                                    FontWeight: =FontWeight.Bold
                                    Height: =47
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(varLatestWeek.Defects_per_home, "0.0")
                                    Width: =107
                                    Wrap: =false
                                    X: =20
                                    Y: =7
                              - lbl_dph_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="DEFECTS PER FLOOR"
                                    Wrap: =false
                                    X: =20
                                    Y: =50
                        - tile_cost:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.Regular
                              Fill: =CardBg
                              Height: =Parent.Height-4
                              LayoutMinHeight: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =false
                              Width: =220
                            Children:
                              - rect_cost_accent:
                                  Control: Rectangle
                                  Properties:
                                    Fill: |-
                                      =If((varLatestWeek.Total_cost - varPriorWeek.Total_cost) <= 0,
                                          StatusGoodColor, StatusSeriousColor)
                                    Height: =Parent.Height
                                    Width: =3
                              - btn_cost_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =71
                                    OnSelect: |-
                                      =Set(varWeekKey, varLatestWeek.Week_key);
                                      Navigate(scr_WeekDetail, ScreenTransition.None)
                                    Text: =""
                                    Width: =220
                              - badge_cost_delta:
                                  Control: Badge
                                  Properties:
                                    Content: |-
                                      =If((varLatestWeek.Total_cost - varPriorWeek.Total_cost) <= 0, "▼ ", "▲ ") &
                                          Text(Abs(varLatestWeek.Total_cost - varPriorWeek.Total_cost), "[$-en-US]$#,##0")
                                    Height: =Parent.Height*0.6
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: |-
                                      =If(IsBlank(varLatestWeek.Total_cost), 'BadgeCanvas.ThemeColor'.Subtle,
                                          (varLatestWeek.Total_cost - varPriorWeek.Total_cost) <= 0,
                                              'BadgeCanvas.ThemeColor'.Success,
                                          'BadgeCanvas.ThemeColor'.Danger)
                                    Width: =92
                                    X: =Parent.Width*1.2/2
                                    Y: =(Parent.Height-Self.Height)/2
                              - lbl_cost_value:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextPrimary
                                    FontWeight: =FontWeight.Bold
                                    Height: =47
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =28
                                    Text: =Text(varLatestWeek.Total_cost, "[$-en-US]$#,##0")
                                    Width: =107
                                    Wrap: =false
                                    X: =20
                                    Y: =7
                              - lbl_cost_label:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
