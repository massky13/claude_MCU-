Screens:
  scr_WeekDetail:
    Properties:
      Fill: =PageBg
      OnVisible: |-
        =Reset(tabs_main_wd);
        If(!IsBlank(varPID) && !IsBlank(varWeekKey) && !IsBlank(varFacility),
            ClearCollect(col_homes,
                Filter(qk_home,
                    Plant_ID = varPID && Week_key = varWeekKey && Facility_ID = varFacility));
            ClearCollect(col_week_defects,
                Filter(qk_home_defect,
                    Plant_ID = varPID && Week_key = varWeekKey && Facility_ID = varFacility));
            Set(varWeekRow, LookUp(col_week, Week_key = varWeekKey && Facility_ID = varFacility));
            Set(varExpandedHomeNum, Blank());
            Set(varHomeNumberNum, Blank());
            Set(varHomeNumberText, Blank())
        )
    Children:
      - cnt_root_wd:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - cnt_header_wd:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ChampionBlue
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - cnt_header_left_wd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - img_logo_wd:
                            Control: Image
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =quality_logo
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Height
                        - lbl_title_wd:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.Arial
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Quality KPI Reporting"
                              Width: =300
                              Wrap: =false
                  - cnt_header_right_wd:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lbl_plant_wd:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =If(IsBlank(varPID), "Select a plant",
                                    Text(varPID) & " - " & LookUp(col_plants, Plant_ID = varPID, Plant_Names))
                              Wrap: =false
                        - ico_admin_wd:
                            Control: ModernIcon
                            Properties:
                              Icon: ="Settings"
                              IconColor: =RGBA(255, 255, 255, 1)
                              OnSelect: =Navigate(scr_TaxonomyAdmin, ScreenTransition.None)
                              Tooltip: ="Admin"
                              Visible: =varIsAdmin
            - cnt_nav_wd:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =CardBg
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  Width: =Parent.Width
                Children:
                  - tabs_main_wd:
                      Control: ModernTabList
                      Properties:
                        AlignInContainer: =AlignInContainer.End
                        Default: |-
                          ={Value: "Week Detail"}
                        FillPortions: =1
                        Items: |-
                          =If(varIsAdmin,
                              If(!IsBlank(varAccessRow) && varAccessRow.Plant_ID = 0,
                                  Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"}),
                                  Table({Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"})
                              ),
                              If(!IsBlank(varAccessRow) && varAccessRow.Plant_ID = 0,
                                  Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}),
                                  Table({Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"})
                              )
                          )
                        LayoutMinHeight: =38
                        OnChange: |-
                          =If(tabs_main_wd.Selected.Value = "Corporate Home", Navigate(scr_CorporateHome, ScreenTransition.None),
                              tabs_main_wd.Selected.Value = "Dashboard", Navigate(scr_Dashboard, ScreenTransition.None),
                              tabs_main_wd.Selected.Value = "Data Entry", Navigate(scr_Entry, ScreenTransition.None),
                              tabs_main_wd.Selected.Value = "Week Detail", Navigate(scr_WeekDetail, ScreenTransition.None),
                              tabs_main_wd.Selected.Value = "History", Navigate(scr_History, ScreenTransition.None),
                              tabs_main_wd.Selected.Value = "Taxonomy", Navigate(scr_TaxonomyAdmin, ScreenTransition.None),
                              tabs_main_wd.Selected.Value = "Access", Navigate(scr_AccessAdmin, ScreenTransition.None))
            - cnt_week_header:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =CardBorder
                  BorderThickness: =1
                  Fill: =CardBg
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =10
                  Width: =Parent.Width
                Children:
                  - lbl_week_header:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =TextPrimary
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="Week ending " & If(IsBlank(varWeekRow), "-", Text(varWeekRow.Week_end, "mmmm d, yyyy")) & " . Facility " & Text(varFacility, "0")
                        Wrap: =false
            - cnt_main_wd:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =PageBg
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width
                Children:
                  - lbl_empty_state_wd:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =TextMuted
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="No week selected. Return to the Dashboard and choose a week."
                        Visible: =IsBlank(varWeekKey) || IsBlank(varFacility)
                  - cnt_cards_row:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =476
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =!(IsBlank(varWeekKey) || IsBlank(varFacility))
                        Width: =236
                      Children:
                        - crd_ftt:
                            Control: ModernCard
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderRadius: =8
                              Description: |-
                                =With(
                                    {fStatus: BandStatusOf(varWeekRow.FTT_pct)},
                                    StatusGlyphOf(fStatus) & " " & If(IsBlank(varWeekRow.FTT_pct), "no data", Text(varWeekRow.FTT_pct, "0.0") & "%")
                                )
                              DescriptionColor: |-
                                =With(
                                    {fStatus: BandStatusOf(varWeekRow.FTT_pct)},
                                    StatusColorOf(fStatus)
                                )
                              DescriptionSize: =28
                              Fill: =CardBg
                              Height: =110
                              Subtitle: ="All 3 tests pass"
                              SubtitleColor: =TextSecondary
                              SubtitleSize: =11
                              Title: ="First Time Through"
                              TitleColor: =TextPrimary
                              Width: =220
                        - gal_test_cards:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                              Items: =Sort(col_test, Sort_order)
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplateSize: =122
                              Width: =Parent.Width
                            Children:
                              - crd_test:
                                  Control: ModernCard
                                  Properties:
                                    BorderRadius: =8
                                    Description: |-
                                      =With(
                                          {tRow: LookUp(col_test_sum, Week_key = varWeekKey && Facility_ID = varFacility && Test_ID = Value(ThisItem.Title))},
                                          With(
                                              {tStatus: BandStatusOf(tRow.Test_FPY)},
                                              StatusGlyphOf(tStatus) & " " & If(IsBlank(tRow.Test_FPY), "no data", Text(tRow.Test_FPY, "0.0") & "%")
                                          )
                                      )
                                    DescriptionColor: |-
                                      =With(
                                          {tRow: LookUp(col_test_sum, Week_key = varWeekKey && Facility_ID = varFacility && Test_ID = Value(ThisItem.Title))},
                                          With(
                                              {tStatus: BandStatusOf(tRow.Test_FPY)},
                                              StatusColorOf(tStatus)
                                          )
                                      )
                                    DescriptionSize: =28
                                    Fill: =CardBg
                                    Subtitle: ="Test FPY"
                                    SubtitleColor: =TextSecondary
                                    SubtitleSize: =11
                                    Title: =ThisItem.Test_name
                                    TitleColor: =TextPrimary
                                    Width: =220
                  - gal_week_homes_detail:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                        Items: =Sort(col_homes, Home_number, SortOrder.Descending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =56
                        Visible: =!(IsBlank(varWeekKey) || IsBlank(varFacility))
                      Children:
                        - crd_home_row:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =56
                              Width: =Parent.Width
                            Children:
                              - cnt_home_row_content:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =CardBg
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Width: =Parent.Width
                                  Children:
                                    - lbl_home_number:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =TextPrimary
                                          FontWeight: =FontWeight.Semibold
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =Text(ThisItem.Home_number, "0")
                                          Width: =90
                                          Wrap: =false
                                    - bdg_elec:
                                        Control: Badge
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          Content: |-
                                            =If(IsBlank(ThisItem.Elec_result), StatusGlyphOf("nodata") & " N/T",
                                                If(ThisItem.Elec_result = 1, StatusGlyphOf("good") & " Pass", StatusGlyphOf("critical") & " Fail"))
                                          Height: =20
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |-
                                            =If(IsBlank(ThisItem.Elec_result), 'BadgeCanvas.ThemeColor'.Subtle,
                                                If(ThisItem.Elec_result = 1, 'BadgeCanvas.ThemeColor'.Success, 'BadgeCanvas.ThemeColor'.Danger))
                                          Width: =80
                                    - bdg_plumb:
                                        Control: Badge
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          Content: |-
                                            =If(IsBlank(ThisItem.Plumb_result), StatusGlyphOf("nodata") & " N/T",
                                                If(ThisItem.Plumb_result = 1, StatusGlyphOf("good") & " Pass", StatusGlyphOf("critical") & " Fail"))
                                          Height: =20
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |-
                                            =If(IsBlank(ThisItem.Plumb_result), 'BadgeCanvas.ThemeColor'.Subtle,
                                                If(ThisItem.Plumb_result = 1, 'BadgeCanvas.ThemeColor'.Success, 'BadgeCanvas.ThemeColor'.Danger))
                                          Width: =80
                                    - bdg_gas:
                                        Control: Badge
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          Content: |-
                                            =If(IsBlank(ThisItem.Gas_result), StatusGlyphOf("nodata") & " N/T",
                                                If(ThisItem.Gas_result = 1, StatusGlyphOf("good") & " Pass", StatusGlyphOf("critical") & " Fail"))
                                          Height: =20
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |-
                                            =If(IsBlank(ThisItem.Gas_result), 'BadgeCanvas.ThemeColor'.Subtle,
                                                If(ThisItem.Gas_result = 1, 'BadgeCanvas.ThemeColor'.Success, 'BadgeCanvas.ThemeColor'.Danger))
                                          Width: =80
                                    - lbl_defect_count_wd:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Right
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =TextSecondary
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Defects " & Text(Coalesce(Sum(Filter(col_week_defects, Home_number = Text(ThisItem.Home_number, "0")), Coalesce(Qty, 1)), 0), "0")
                                          Width: =90
                                          Wrap: =false
                              - btn_home_row_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =56
                                    OnSelect: |-
                                      =Set(varExpandedHomeNum,
                                          If(varExpandedHomeNum = ThisItem.Home_number, Blank(), ThisItem.Home_number));
                                      If(!IsBlank(varExpandedHomeNum),
                                          Set(varHomeNumberNum, varExpandedHomeNum);
                                          Set(varHomeNumberText, Text(varExpandedHomeNum, "0"));
                                          ClearCollect(col_home_defects,
                                              Filter(qk_home_defect,
                                                  Plant_ID = varPID && Home_number = varHomeNumberText))
                                      )
                                    Text: =""
                                    Width: =Parent.Width
                  - cnt_defect_detail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =CardBorder
                        BorderThickness: =1
                        Fill: =CardBg
                        FillPortions: =0
                        Height: =24 + 20 + 8 + gal_home_defects.Height + 8 + If(CountRows(col_home_defects) = 0, 16, 0)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =12
                        Visible: =!IsBlank(varExpandedHomeNum)
                      Children:
                        - lbl_defect_detail_header:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =TextPrimary
                              FontWeight: =FontWeight.Bold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="Defects for home " & If(IsBlank(varExpandedHomeNum), "", Text(varExpandedHomeNum, "0"))
                              Wrap: =false
                        - gal_home_defects:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =0
                              Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                              Items: =col_home_defects
                              TemplateSize: =40
                              Visible: =CountRows(col_home_defects) > 0
                            Children:
                              - lbl_defect_name_wd:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextPrimary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =Coalesce(LookUp(col_defect, Value(Title) = ThisItem.Defect_ID).Defect_name, "Unknown defect")
                                    Width: =220
                                    Wrap: =false
                              - lbl_defect_type:
                                  Control: ModernText
                                  Properties:
                                    Color: =TextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =With(
                                          {tType: LookUp(col_type, Value(Title) = ThisItem.Type_ID)},
                                          Coalesce(tType.Type_name, "") & " . " & Coalesce(tType.QP_ref, "")
                                      )
                                    Width: =180
                                    Wrap: =false
                              - lbl_defect_qty:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Right
                                    Color: =TextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Qty " & Text(ThisItem.Qty, "0")
                                    Width: =70
                                    Wrap: =false
                              - lbl_defect_severity:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Right
                                    Color: =TextSecondary
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Severity " & Text(ThisItem.Severity, "0")
                                    Width: =90
                                    Wrap: =false
                        - lbl_no_defects:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =TextMuted
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="No defects recorded for this home."
                              Visible: =CountRows(col_home_defects) = 0
