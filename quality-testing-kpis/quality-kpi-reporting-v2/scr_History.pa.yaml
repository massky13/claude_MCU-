Screens:
  scr_History:
    Properties:
      Fill: =PageBg
      OnVisible: =Reset(tabs_main_hist)
    Children:
      - cnt_root_hist:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutOverflowY: =LayoutOverflow.Scroll
            Width: =Parent.Width
          Children:
            - cnt_header_hist:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ChampionBlue
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  Width: =Parent.Width
                Children:
                  - cnt_header_left_hist:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - img_logo_hist:
                            Control: Image
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =quality_logo
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Height
                        - lbl_title_hist:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =true
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.Arial
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Quality KPI Reporting"
                              Width: =300
                              Wrap: =false
                  - cnt_header_right_hist:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =VerticalAlign.Middle
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lbl_plant_hist:
                            Control: ModernText
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =If(IsBlank(varPID), "Select a plant",
                                    Text(varPID) & " - " & LookUp(col_plants, Plant_ID = varPID, Plant_Names))
                              Wrap: =false
                        - ico_theme_hist:
                            Control: ModernIcon
                            Properties:
                              Icon: ="WeatherSunny"
                              IconColor: =RGBA(255, 255, 255, 1)
                              OnSelect: =Set(varDarkMode, !Coalesce(varDarkMode, false))
                              Tooltip: ="Toggle theme"
                        - ico_admin_hist:
                            Control: ModernIcon
                            Properties:
                              Icon: ="Settings"
                              IconColor: =RGBA(255, 255, 255, 1)
                              OnSelect: =Navigate(scr_TaxonomyAdmin, ScreenTransition.None)
                              Tooltip: ="Admin"
                              Visible: =varIsAdmin
            - cnt_nav_hist:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =CardBg
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =VerticalAlign.Middle
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  Width: =Parent.Width
                Children:
                  - tabs_main_hist:
                      Control: ModernTabList
                      Properties:
                        AlignInContainer: =AlignInContainer.End
                        Default: |-
                          ={Value: "History"}
                        FillPortions: =1
                        Items: |-
                          =// Everyone can return to scr_CorporateHome. A non-admin looking at a plant that
                          // is not their own (IsForeignPlant) gets its dashboard and nothing further.
                          If(varIsAdmin,
                              Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Taxonomy"}, {Value: "Access"}),
                              IsForeignPlant(),
                              Table({Value: "Corporate Home"}, {Value: "Dashboard"}),
                              // Plant QMs get the cost-only view of scr_TaxonomyAdmin (IsCostOnlyMode).
                              varIsQM && HasPlantCostScope(),
                              Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"}, {Value: "Defect Costs"}),
                              Table({Value: "Corporate Home"}, {Value: "Dashboard"}, {Value: "Data Entry"}, {Value: "Week Detail"}, {Value: "History"})
                          )
                        LayoutMinHeight: =38
                        OnChange: |-
                          =If(tabs_main_hist.Selected.Value = "Corporate Home", Navigate(scr_CorporateHome, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "Dashboard", Navigate(scr_Dashboard, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "Data Entry", Navigate(scr_Entry, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "Week Detail", Navigate(scr_WeekDetail, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "History", Navigate(scr_History, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "Taxonomy", Navigate(scr_TaxonomyAdmin, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "Defect Costs", Navigate(scr_TaxonomyAdmin, ScreenTransition.None),
                              tabs_main_hist.Selected.Value = "Access", Navigate(scr_AccessAdmin, ScreenTransition.None))
            - cnt_main_hist:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =PageBg
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Width: =Parent.Width
                Children:
                  - lbl_empty_state_hist:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        Color: =TextMuted
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Select a plant above to load its history."
                        Visible: =IsBlank(varPID)
                        Width: =Parent.Width
                        Wrap: =false
                  - lbl_gal_weeks_title:
                      Control: ModernText
                      Properties:
                        Color: =TextPrimary
                        FontWeight: =FontWeight.Bold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="Weekly Detail (e/p/g)"
                        Visible: =!IsBlank(varPID)
                        Wrap: =false
                  - gal_weeks:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =CardBg
                        Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                        Items: =Sort(varWeekView, Week_key, SortOrder.Descending)
                        TemplateSize: =56
                        Visible: =!IsBlank(varPID)
                        Width: =Parent.Width
                      Children:
                        - cnt_gw_row:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Height: =Parent.TemplateHeight
                              Width: =Parent.Width
                            Children:
                              - cnt_gw_row_content:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =Parent.Height
                                    LayoutAlignItems: =VerticalAlign.Middle
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingLeft: =5
                                    Width: =Parent.Width
                                  Children:
                                    - lbl_gw_week:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =Text(ThisItem.Week_end, "mmm d, yyyy")
                                          Width: =110
                                          Wrap: =false
                                    - lbl_gw_homes:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Right
                                          AlignInContainer: =AlignInContainer.Stretch
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =Text(ThisItem.Floors_tested, "0") & " Floors"
                                          Width: =60
                                          Wrap: =false
                                    - gal_gw_tests:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          FillPortions: =0
                                          Height: =Parent.Height
                                          Items: =AddColumns(Sort(col_test, Sort_order), Week_key, ThisItem.Week_key, Test_ID, Value(Title))
                                          LayoutMaxHeight: =Parent.Height
                                          LayoutMinHeight: =2
                                          ShowScrollbar: =false
                                          TemplateSize: =90
                                          Width: =270
                                        Children:
                                          - lbl_gw_test_pf:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Color: =TestColorOf(ThisItem.Test_ID)
                                                FontWeight: =FontWeight.Semibold
                                                Height: =Parent.TemplateHeight
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: |-
                                                  =Text(LookUp(col_test_sum, Week_key = ThisItem.Week_key && Test_ID = ThisItem.Test_ID, Pass), "0") &
                                                      "/" &
                                                      Text(LookUp(col_test_sum, Week_key = ThisItem.Week_key && Test_ID = ThisItem.Test_ID, Fail), "0")
                                                Width: =Parent.TemplateWidth
                                                Wrap: =false
                                    - badge_gw_ftt:
                                        Control: Badge
                                        Properties:
                                          AccessibleLabel: ="First Time Pass Rate " & Text(ThisItem.FTT_pct, "0.0") & "%"
                                          AlignInContainer: =AlignInContainer.Center
                                          Content: =StatusGlyphOf(BandStatusFTPR(ThisItem.FTT_pct)) & " " & Text(ThisItem.FTT_pct, "0.0") & "%"
                                          Height: =20
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |-
                                            =If(BandStatusFTPR(ThisItem.FTT_pct) = "good", 'BadgeCanvas.ThemeColor'.Success,
                                                BandStatusFTPR(ThisItem.FTT_pct) = "warning", 'BadgeCanvas.ThemeColor'.Warning,
                                                BandStatusFTPR(ThisItem.FTT_pct) = "nodata", 'BadgeCanvas.ThemeColor'.Subtle,
                                                'BadgeCanvas.ThemeColor'.Danger)
                                          Width: =80
                                    - lbl_gw_defects:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Right
                                          AlignInContainer: =AlignInContainer.Stretch
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =Text(ThisItem.Total_defects, "0") & " def"
                                          Width: =70
                                          Wrap: =false
                                    - lbl_gw_dpf:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Right
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =TextMuted
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =Text(ThisItem.Defects_per_floor, "0.00") & "/floor"
                                          Width: =80
                                          Wrap: =false
                              - btn_gw_row_overlay:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    BorderThickness: =0
                                    Height: =56
                                    OnSelect: |-
                                      =Set(varWeekKey, ThisItem.Week_key);
                                      Navigate(scr_WeekDetail, ScreenTransition.None)
                                    PaddingLeft: =5
                                    Text: =""
                                    Width: =Parent.Width
