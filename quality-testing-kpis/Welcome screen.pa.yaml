                              - ButtonCanvas2:
                                  Control: Button
                                  Properties:
                                    OnSelect: "=ClearCollect(col_sys_test,Filter(system_testing_data,Plant_ID=PID));\r\nClearCollect(col_calendar,calendar_list);\r\n\r\n// Step 1: Find the first Sunday of the month\r\nSet(\r\n    varFirstSunday,\r\n    DateAdd(\r\n        Date(Year(Today()), Month(Today()), 1), \r\n        8 - Weekday(Date(Year(Today()), Month(Today()), 1), StartOfWeek.Sunday),\r\n        \"Days\"\r\n    )\r\n);\r\n\r\n// Step 2: Find the last day of the month\r\nSet(\r\n    varLastDayOfMonth,\r\n    Date(Year(Today()), Month(Today()) + 1, 0)\r\n);\r\n\r\n// Step 3: Generate the weekly ranges but stop at the last day of the month\r\nClearCollect(\r\n    WeeklyRanges,\r\n    ForAll(\r\n        Sequence(6), // Set a max of 6 iterations, but we will exit early\r\n        {\r\n            WeekNumber: Value,\r\n            Status:3,\r\n            StartDate: DateAdd(varFirstSunday, (Value - 1) * 7, \"Days\"),\r\n            EndDate: \r\n                DateAdd(varFirstSunday, Value * 7 -1 , \"Days\")\r\n\r\n            \r\n        }\r\n    )\r\n);\r\n\r\n// Step 4: Remove any weeks where the StartDate is already in the next month\r\nClearCollect(\r\n    WeeklyRanges,\r\n    Filter(WeeklyRanges, StartDate <= varLastDayOfMonth)\r\n);\r\n\r\nForAll(col_sys_test As current_week,\r\n    Patch(WeeklyRanges, LookUp(WeeklyRanges,EndDate=current_week.Week_end),\r\n        {Status: If(current_week.Week_FPY<0.9,2,1)}\r\n    )\r\n)"
